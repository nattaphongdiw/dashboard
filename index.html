<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1929">
  <title>ศูนย์รวมแดชบอร์ด กร.2 ส่วนที่ 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --navy-950:#0a1929; --navy-900:#102a43; --navy-800:#243b53;
      --navy-700:#334e68; --navy-600:#486581; --navy-300:#9fb3c8;
      --amber:#fbbf24; --bg:#f1f5f9;
    }
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{height:100%;margin:0}
    body{font-family:Sarabun,sans-serif;background:var(--navy-950);color:#fff}
    a{color:inherit;text-decoration:none}
    :focus-visible{outline:3px solid var(--amber);outline-offset:3px}

    /* ---------- หน้า Home ---------- */
    .home{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--navy-950),var(--navy-900) 58%,#0f172a)}
    .home-inner{flex:1;width:100%;max-width:960px;margin:0 auto;padding:clamp(28px,7vh,72px) 24px 24px;display:flex;flex-direction:column;justify-content:center}
    .brand-row{display:flex;align-items:center;gap:18px}
    .logo{width:84px;height:84px;flex:0 0 84px;border-radius:50%;background:#fff;border:2px solid #d9e2ec;display:grid;place-items:center;overflow:hidden;box-shadow:0 2px 10px #0004}
    .logo img{width:100%;height:100%;object-fit:contain}
    h1{font:700 clamp(24px,4.2vw,34px)/1.25 Prompt,Sarabun,sans-serif;margin:0}
    .brand-row p{font-size:14px;color:var(--navy-300);margin:6px 0 0}
    .nav-label{font-size:13px;color:var(--navy-300);font-weight:600;margin:clamp(28px,6vh,52px) 0 12px}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
    .card{display:flex;align-items:center;gap:18px;padding:24px 22px;border:1px solid var(--navy-700);border-radius:14px;background:var(--navy-800);transition:border-color .18s,background .18s}
    .card:hover{background:#2c4764;border-color:#fbbf2470}
    .card .ico{width:56px;height:56px;flex:0 0 56px;display:grid;place-items:center;border-radius:14px;background:var(--navy-950);color:var(--amber);font-size:24px}
    .card .txt{flex:1;min-width:0}
    .card strong{display:block;font:600 18px/1.35 Prompt,Sarabun,sans-serif}
    .card small{display:block;color:var(--navy-300);font-size:13px;margin-top:5px;line-height:1.45}
    .card .go{color:var(--navy-300);font-size:15px;transition:color .18s}
    .card:hover .go{color:var(--amber)}
    .home-footer{padding:18px 24px;border-top:1px solid #334e686b;text-align:center;color:var(--navy-300);font-size:12px;line-height:1.6}

    /* ---------- หน้าแดชบอร์ดเต็มจอ ---------- */
    .viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
    .topbar{flex:0 0 44px;display:flex;align-items:center;padding:0 10px;background:var(--navy-950);border-bottom:1px solid var(--navy-700)}
    .back{display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 14px;border-radius:9px;border:1px solid var(--navy-600);background:var(--navy-900);color:#fff;font:600 13px/1 Sarabun,sans-serif;transition:background .18s,border-color .18s}
    .back i{color:var(--amber)}
    .back:hover{background:var(--navy-800);border-color:#fbbf2470}
    .stage{flex:1;min-height:0;position:relative}
    .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}

    @media(max-width:520px){
      .logo{width:64px;height:64px;flex-basis:64px}
      .brand-row{gap:14px}
      .card{padding:18px 16px;gap:14px}
      .card .ico{width:48px;height:48px;flex-basis:48px;font-size:21px}
    }
  </style>
</head>

<script>
  // ชื่อไฟล์ต้องอยู่ในโฟลเดอร์เดียวกับ index.html
  const pages = {
    area: {
      title: 'เขตพื้นที่รับผิดชอบ (กทม.) – กร.2 ส่วนที่ 6',
      src: 'เขตพื้นที่รับผิดชอบ%20(กทม.)%20%E2%80%93%20กร.2%20ส่วนที่%206%20v2(1).html'

      title: 'โรงงานอุตสาหกรรม ประเภท 7 (1–5)',
      src: 'Dashboard_โรงงานประเภท_7(1).html'
    }
  };

  const home = document.getElementById('home');
  const viewer = document.getElementById('viewer');
  const stage = document.getElementById('stage');
  const homeTitle = document.title;
  let current = null;

  function render() {
    const key = decodeURIComponent(location.hash.slice(1));
    const page = pages[key];

    if (page) {
      home.hidden = true;
      viewer.hidden = false;
      document.title = page.title + ' | ศูนย์รวมแดชบอร์ด';
      if (current !== key) {
        // สร้าง iframe ใหม่ทุกครั้ง เพื่อให้ข้อมูลโหลดสดใหม่ และไม่ทำให้ประวัติเบราว์เซอร์ซ้อน
        stage.replaceChildren();
        const frame = document.createElement('iframe');
        frame.title = page.title;
        frame.src = page.src;
        stage.appendChild(frame);
        current = key;
      }
    } else {
      stage.replaceChildren();
      current = null;
      viewer.hidden = true;
      home.hidden = false;
      document.title = homeTitle;
    }
  }

  window.addEventListener('hashchange', render);
  render();
</script>
