<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนผังโรงงานรายแขวง</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--ink:#102a43;--mu:#64748b;--bd:#e2e8f0;--soft:#f0f4f8;--nv:#243b53;--pb:#102a43;--pc:#fff;--pbd:#102a43;--mp:#243b53;--sel:#102a43;--ok:#10b981;--okb:#ecfdf5;--okt:#047857;--un:#f59e0b;--unb:#fffbeb;--unt:#b45309;--yl:#eab308;--ylb:#fefce8;--ylt:#a16207;--rd:#ef4444;--rdb:#fef2f2;--rdt:#b91c1c;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1929;--card:#102a43;--tx:#e6edf5;--ink:#e6edf5;--mu:#9fb3c8;--bd:#243b53;--soft:#17324d;--nv:#9fb3c8;--pb:#243b53;--pbd:rgba(251,191,36,.55);--mp:#4aa3df;--sel:#fbbf24;--okb:rgba(16,185,129,.16);--okt:#34d399;--unb:rgba(245,158,11,.16);--unt:#fbbf24;--ylb:rgba(234,179,8,.16);--ylt:#facc15;--rdb:rgba(239,68,68,.16);--rdt:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1929;--card:#102a43;--tx:#e6edf5;--ink:#e6edf5;--mu:#9fb3c8;--bd:#243b53;--soft:#17324d;--nv:#9fb3c8;--pb:#243b53;--pbd:rgba(251,191,36,.55);--mp:#4aa3df;--sel:#fbbf24;--okb:rgba(16,185,129,.16);--okt:#34d399;--unb:rgba(245,158,11,.16);--unt:#fbbf24;--ylb:rgba(234,179,8,.16);--ylt:#facc15;--rdb:rgba(239,68,68,.16);--rdt:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{max-width:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 Sarabun,"Noto Sans Thai",system-ui,sans-serif}
h1,h2,.kv{font-family:Prompt,Sarabun,system-ui,sans-serif}
svg{display:block}
header{background:linear-gradient(90deg,#0a1929,#102a43 55%,#0f172a);color:#fff;border-bottom:1px solid #243b53;box-shadow:0 4px 12px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}
.hd{max-width:1280px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}.brand>div{min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:rgba(36,59,83,.9);border:1px solid rgba(72,101,129,.6);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.logo img{width:100%;height:100%;object-fit:contain;max-width:100%}
h1{margin:0;font-size:22px;font-weight:700;line-height:1.3;display:inline}
.badge{display:inline-block;margin-left:8px;vertical-align:middle;font-size:12px;padding:1px 10px;border-radius:99px;background:rgba(245,158,11,.2);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
.sub{color:#cbd5e1;font-size:13px;margin-top:2px}
#upd{color:#9fb3c8;font-size:12px}
.wrap{max-width:1280px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.wrap>*,.grid>*,.card{min-width:0}
h2{margin:0 0 12px;font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 svg{color:var(--nv)}
h3{font-size:12px;color:var(--mu);margin:14px 0 2px;font-weight:600;letter-spacing:.03em}
.mu{color:var(--mu)}.sm{font-size:12px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
input[type=checkbox]{padding:0;width:16px;height:16px}
button{cursor:pointer}button:hover{border-color:var(--nv)}
#msg{background:var(--unb);border:1px solid var(--un);border-radius:12px;padding:10px 14px}
#msg[hidden]{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font-weight:500;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.tabs button[aria-pressed="true"]{background:var(--pb);color:var(--pc);border-color:var(--pbd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.06);padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kc{position:relative;overflow:hidden;padding:18px 20px 20px}
.kc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.kt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%}
.kl{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--lt)}
.kv{font-size:30px;font-weight:700;line-height:1.2;margin-top:6px;color:var(--tt)}
.kv small{font-family:Sarabun,sans-serif;font-size:14px;font-weight:500;color:var(--mu)}
.ks{margin:6px 0 0;font-size:12px;color:var(--mu)}
.pc{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:600;background:var(--tb);color:var(--tt)}
.ki{width:44px;height:44px;border-radius:12px;background:var(--tb);color:var(--tt);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.t-nv{--c:var(--nv);--tb:var(--soft);--tt:var(--ink);--lt:var(--mu)}
.t-ok{--c:var(--ok);--tb:var(--okb);--tt:var(--okt);--lt:var(--okt)}
.t-yl{--c:var(--yl);--tb:var(--ylb);--tt:var(--ylt);--lt:var(--ylt)}
.t-rd{--c:var(--rd);--tb:var(--rdb);--tt:var(--rdt);--lt:var(--rdt)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
label.sm{display:flex;align-items:center;gap:6px}
#map{width:100%;height:auto}
#map path{fill:var(--mp);fill-rule:evenodd;stroke:var(--card);stroke-width:3;cursor:pointer}
#map path.sel{stroke:var(--sel);stroke-width:4}
#map path.o{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-opacity:.55;pointer-events:none}
g.off{opacity:.25}
.t{text-anchor:middle;fill:var(--tx);paint-order:stroke;stroke:var(--card);stroke-width:3px;pointer-events:none;font-family:Prompt,Sarabun,sans-serif}
.b{font-size:16px;font-weight:600}.v{font-size:22px;font-weight:700}.s{font-size:11px;font-family:Sarabun,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--tb);color:var(--tt)}
.r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;margin:8px 0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.track{grid-column:1/3;height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bar{height:100%;border-radius:7px;background:var(--nv)}.bar.rk{background:var(--un)}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);margin-top:10px}
.lg i{flex:1;max-width:160px;height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--mp));border:1px solid var(--bd)}
.t-item{border-radius:10px;padding:4px 8px;margin:2px -8px;cursor:pointer;transition:background .15s}
.t-item:hover{background:var(--soft)}
.t-item .r{margin:2px 0}
.t-item .r>span{display:flex;align-items:center;gap:4px;font-weight:500}
.chev{display:inline-block;font-size:10px;color:var(--mu);transition:transform .2s;width:12px;text-align:center}
.t-item.open .chev{transform:rotate(90deg);color:var(--ink)}
.sub-box{margin:6px 0 4px 16px;padding:8px 10px;background:var(--soft);border-left:3px solid var(--nv);border-radius:0 10px 10px 0;display:grid;gap:6px;cursor:default}
.sub-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:5px 8px;border-radius:8px;background:var(--card);border:1px solid var(--bd)}
.sub-info{min-width:0;flex:1}
.sub-code{font-weight:600;font-size:13px}
.sub-act{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub-cnt{font-weight:600;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap;flex-shrink:0}
