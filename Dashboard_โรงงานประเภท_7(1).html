        };

        // ============================================================================
        // 3. INITIALIZATION &amp; UI POPULATION
        // ============================================================================
        document.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {
            populateDropdowns();
            bindEvents();
            Chart.defaults.font.family = &quot;&#x27;Sarabun&#x27;, sans-serif&quot;;
            applyFiltersAndRender();
        });

        function populateDropdowns() {
            const provSelect = document.getElementById(&#x27;provinceFilter&#x27;);
            const counts = {};
            ALL_FACTORIES.forEach(f =&gt; { counts[f.province] = (counts[f.province] || 0) + 1; });
            const sortedProvinces = [...new Set(ALL_FACTORIES.map(f =&gt; f.province))].sort((a, b) =&gt; a.localeCompare(b, &#x27;th&#x27;));
            sortedProvinces.forEach(prov =&gt; {
                const opt = document.createElement(&#x27;option&#x27;);
                opt.value = prov;
                opt.textContent = `${prov} (${counts[prov] || 0} แห่ง)`;
                provSelect.appendChild(opt);
            });

            const groupSelect = document.getElementById(&#x27;groupFilter&#x27;);
            const groupCounts = {};
            ALL_FACTORIES.forEach(f =&gt; { groupCounts[f.group] = (groupCounts[f.group] || 0) + 1; });
            const sortedGroups = [...new Set(ALL_FACTORIES.map(f =&gt; f.group))].sort((a, b) =&gt; a.localeCompare(b, &#x27;th&#x27;));
            sortedGroups.forEach(grp =&gt; {
                const opt = document.createElement(&#x27;option&#x27;);
                opt.value = grp;
                opt.textContent = `${grp} (${groupCounts[grp] || 0} แห่ง)`;
                groupSelect.appendChild(opt);
            });
        }

        function bindEvents() {
            const searchInput = document.getElementById(&#x27;searchInput&#x27;);
            const btnClearSearch = document.getElementById(&#x27;btnClearSearch&#x27;);
            searchInput.addEventListener(&#x27;input&#x27;, (e) =&gt; {
                const val = e.target.value.trim();
                btnClearSearch.classList.toggle(&#x27;hidden&#x27;, val.length === 0);
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() =&gt; {
                    state.search = val;
                    state.currentPage = 1;
                    applyFiltersAndRender();
                }, 150);
            });

            btnClearSearch.addEventListener(&#x27;click&#x27;, () =&gt; {
                clearTimeout(searchDebounceTimer);
                searchInput.value = &#x27;&#x27;;
                state.search = &#x27;&#x27;;
                btnClearSearch.classList.add(&#x27;hidden&#x27;);
                state.currentPage = 1;
                applyFiltersAndRender();
            });

            document.getElementById(&#x27;provinceFilter&#x27;).addEventListener(&#x27;change&#x27;, (e) =&gt; {
                state.province = e.target.value;
                state.currentPage = 1;
                applyFiltersAndRender();
            });

            document.getElementById(&#x27;groupFilter&#x27;).addEventListener(&#x27;change&#x27;, (e) =&gt; {
                state.group = e.target.value;
                state.currentPage = 1;
                applyFiltersAndRender();
            });

            document.querySelectorAll(&#x27;.status-pill&#x27;).forEach(btn =&gt; {
                btn.addEventListener(&#x27;click&#x27;, () =&gt; {
                    const statusVal = btn.getAttribute(&#x27;data-status&#x27;);
                    if (statusVal === &#x27;ALL&#x27;) {
                        state.statuses.clear();
                    } else {
                        if (state.statuses.has(statusVal)) {
                            state.statuses.delete(statusVal);
                        } else {
                            state.statuses.add(statusVal);
                        }
                        if (state.statuses.size === 2) {
                            state.statuses.clear();
                        }
                    }
                    updateStatusPillsUI();
                    state.currentPage = 1;
                    applyFiltersAndRender();
                });
            });

            document.getElementById(&#x27;btnResetFilters&#x27;).addEventListener(&#x27;click&#x27;, resetAllFilters);
            document.getElementById(&#x27;btnExportCSV&#x27;).addEventListener(&#x27;click&#x27;, exportFilteredCSV);
            document.getElementById(&#x27;pageSizeSelect&#x27;).addEventListener(&#x27;change&#x27;, (e) =&gt; {
                state.pageSize = parseInt(e.target.value, 10);
                state.currentPage = 1;
                renderTable();
            });

            document.querySelectorAll(&#x27;.sort-header&#x27;).forEach(th =&gt; {
                th.addEventListener(&#x27;click&#x27;, () =&gt; {
                    const key = th.getAttribute(&#x27;data-sort&#x27;);
                    if (state.sortKey === key) {
                        state.sortAsc = !state.sortAsc;
                    } else {
                        state.sortKey = key;
                        state.sortAsc = true;
                    }
                    updateSortIcons();
                    sortFilteredData();
                    renderTable();
                });
            });

            document.getElementById(&#x27;btnCloseModalTop&#x27;).addEventListener(&#x27;click&#x27;, closeModal);
            document.getElementById(&#x27;btnCloseModalBottom&#x27;).addEventListener(&#x27;click&#x27;, closeModal);
            document.getElementById(&#x27;detailModal&#x27;).addEventListener(&#x27;click&#x27;, (e) =&gt; {
                if (e.target.id === &#x27;detailModal&#x27;) closeModal();
            });
            document.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
                if (e.key === &#x27;Escape&#x27;) closeModal();
            });
        }

        function updateStatusPillsUI() {
            const isAll = state.statuses.size === 0;
            document.querySelectorAll(&#x27;.status-pill&#x27;).forEach(btn =&gt; {
                const st = btn.getAttribute(&#x27;data-status&#x27;);
                const active = (st === &#x27;ALL&#x27; &amp;&amp; isAll) || (st !== &#x27;ALL&#x27; &amp;&amp; state.statuses.has(st));

                btn.className = &#x27;status-pill px-3.5 py-2 rounded-xl text-sm font-medium border transition-all cursor-pointer &#x27;;
                if (active) {
                    if (st === &#x27;ALL&#x27;) {
                        btn.className += &#x27;bg-navy-900 text-white border-navy-900 shadow-sm&#x27;;
                    } else if (st === &#x27;แจ้งประกอบแล้ว&#x27;) {
                        btn.className += &#x27;bg-emerald-600 text-white border-emerald-600 shadow-sm&#x27;;
                    } else if (st === &#x27;ยังไม่แจ้งประกอบ&#x27;) {
                        btn.className += &#x27;bg-amber-500 text-white border-amber-500 shadow-sm&#x27;;
                    }
                } else {
                    btn.className += &#x27;bg-white text-slate-700 border-slate-200 hover:bg-slate-50&#x27;;
                }
            });
        }

        function resetAllFilters() {
            clearTimeout(searchDebounceTimer);
            state.search = &#x27;&#x27;;
            state.province = &#x27;ALL&#x27;;
            state.statuses.clear();
            state.group = &#x27;ALL&#x27;;
            state.sortKey = &#x27;id&#x27;;
            state.sortAsc = true;
            state.currentPage = 1;

            document.getElementById(&#x27;searchInput&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;btnClearSearch&#x27;).classList.add(&#x27;hidden&#x27;);
            document.getElementById(&#x27;provinceFilter&#x27;).value = &#x27;ALL&#x27;;
            document.getElementById(&#x27;groupFilter&#x27;).value = &#x27;ALL&#x27;;

            updateStatusPillsUI();
            updateSortIcons();
            applyFiltersAndRender();
        }

        // ============================================================================
        // 4. FILTERING &amp; RENDER LOGIC
        // ============================================================================
        function applyFiltersAndRender() {
            const q = state.search.toLowerCase();

            filteredFactories = ALL_FACTORIES.filter(item =&gt; {
                if (state.province !== &#x27;ALL&#x27; &amp;&amp; item.province !== state.province) return false;
                if (state.statuses.size &gt; 0 &amp;&amp; !state.statuses.has(item.status)) return false;
                if (state.group !== &#x27;ALL&#x27; &amp;&amp; item.group !== state.group) return false;

                if (q) {
                    const haystack = `${item.name} ${item.regNo} ${item.fid} ${item.business} ${item.province}`.toLowerCase();
                    if (!haystack.includes(q)) return false;
                }
                return true;
            });

            sortFilteredData();
            updateKPIs();
            renderCharts();
            renderTable();
        }

        function sortFilteredData() {
            const key = state.sortKey;
            const dir = state.sortAsc ? 1 : -1;

            filteredFactories.sort((a, b) =&gt; {
                const valA = a[key];
                const valB = b[key];
                if (typeof valA === &#x27;number&#x27; &amp;&amp; typeof valB === &#x27;number&#x27;) {
                    return (valA - valB) * dir;
                }
                return String(valA).localeCompare(String(valB), &#x27;th&#x27;) * dir;
            });
        }

        function updateSortIcons() {
            document.querySelectorAll(&#x27;.sort-header&#x27;).forEach(th =&gt; {
                const key = th.getAttribute(&#x27;data-sort&#x27;);
                const icon = th.querySelector(&#x27;i&#x27;);
                if (key === state.sortKey) {
                    icon.className = state.sortAsc
                        ? &#x27;fa-solid fa-sort-up ml-1 text-amber-400&#x27;
                        : &#x27;fa-solid fa-sort-down ml-1 text-amber-400&#x27;;
                } else {
                    icon.className = &#x27;fa-solid fa-sort ml-1 text-slate-400&#x27;;
                }
            });
        }

        function updateKPIs() {
            const total = filteredFactories.length;
            const activeCount = filteredFactories.filter(f =&gt; f.status === &#x27;แจ้งประกอบแล้ว&#x27;).length;
            const pendingCount = filteredFactories.filter(f =&gt; f.status === &#x27;ยังไม่แจ้งประกอบ&#x27;).length;
            const uniqueProvinces = new Set(filteredFactories.map(f =&gt; f.province)).size;

            const pct = (n) =&gt; total &gt; 0 ? ((n / total) * 100).toFixed(2) + &#x27;%&#x27; : &#x27;0.00%&#x27;;
            const shareOfAll = ((total / ALL_FACTORIES.length) * 100).toFixed(2) + &#x27;%&#x27;;

            document.getElementById(&#x27;kpiTotal&#x27;).textContent = total.toLocaleString();
            document.getElementById(&#x27;kpiTotalPct&#x27;).textContent = shareOfAll;

            document.getElementById(&#x27;kpiActive&#x27;).textContent = activeCount.toLocaleString();
            document.getElementById(&#x27;kpiActivePct&#x27;).textContent = pct(activeCount);

            document.getElementById(&#x27;kpiPending&#x27;).textContent = pendingCount.toLocaleString();
            document.getElementById(&#x27;kpiPendingPct&#x27;).textContent = pct(pendingCount);

            const badge = document.getElementById(&#x27;activeFilterBadge&#x27;);
            if (total === ALL_FACTORIES.length) {
                badge.innerHTML = `กำลังแสดงข้อมูลทั้งหมด &lt;strong class=&quot;text-navy-800&quot;&gt;${total}&lt;/strong&gt; แห่ง (5 จังหวัด)`;
            } else {
                badge.innerHTML = `ผลลัพธ์การกรอง: &lt;strong class=&quot;text-navy-800&quot;&gt;${total}&lt;/strong&gt; แห่ง จากทั้งหมด 6 แห่ง (${uniqueProvinces} จังหวัด)`;
            }
        }

        // ============================================================================
        // 5. CHARTS (CHART.JS)
        // ============================================================================
        function renderCharts() {
            renderProvinceChart();
            renderGroupChart();
            renderYearChart();
        }

        function renderProvinceChart() {
            const provStats = {};
            filteredFactories.forEach(f =&gt; {
                if (!provStats[f.province]) {
                    provStats[f.province] = { total: 0, active: 0, pending: 0 };
                }
                provStats[f.province].total++;
                if (f.status === &#x27;แจ้งประกอบแล้ว&#x27;) provStats[f.province].active++;
                else if (f.status === &#x27;ยังไม่แจ้งประกอบ&#x27;) provStats[f.province].pending++;
            });

            const top10 = Object.entries(provStats)
                .sort((a, b) =&gt; b[1].total - a[1].total || a[0].localeCompare(b[0], &#x27;th&#x27;))
                .slice(0, 10);

            const labels = top10.map(d =&gt; d[0]);
            const activeData = top10.map(d =&gt; d[1].active);
            const pendingData = top10.map(d =&gt; d[1].pending);

            const ctx = document.getElementById(&#x27;provinceChart&#x27;).getContext(&#x27;2d&#x27;);
            if (provinceChartInstance) provinceChartInstance.destroy();

            provinceChartInstance = new Chart(ctx, {
                type: &#x27;bar&#x27;,
                data: {
                    labels,
                    datasets: [
                        {
                            label: &#x27;แจ้งประกอบแล้ว&#x27;,
                            data: activeData,
                            backgroundColor: &#x27;#10b981&#x27;,
                            borderRadius: 4
                        },
                        {
                            label: &#x27;ยังไม่แจ้งประกอบ&#x27;,
                            data: pendingData,
                            backgroundColor: &#x27;#f59e0b&#x27;,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    indexAxis: &#x27;y&#x27;,
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (event, elements) =&gt; {
                        if (elements.length &gt; 0) {
                            const idx = elements[0].index;
                            const clickedProv = labels[idx];
                            const select = document.getElementById(&#x27;provinceFilter&#x27;);
                            if (state.province === clickedProv) {
                                state.province = &#x27;ALL&#x27;;
                                select.value = &#x27;ALL&#x27;;
                            } else {
                                state.province = clickedProv;
                                select.value = clickedProv;
                            }
                            state.currentPage = 1;
                            applyFiltersAndRender();
                        }
                    },
                    onHover: (event, elements) =&gt; {
                        event.native.target.style.cursor = elements.length ? &#x27;pointer&#x27; : &#x27;default&#x27;;
                    },
                    plugins: {
                        legend: {
                            position: &#x27;bottom&#x27;,
                            labels: { usePointStyle: true, padding: 16, font: { size: 12 } }
                        },
                        tooltip: {
                            mode: &#x27;index&#x27;,
                            intersect: false,
                            callbacks: {
                                footer: (items) =&gt; {
                                    const sum = items.reduce((acc, item) =&gt; acc + item.parsed.x, 0);
                                    return `รวมทั้งหมด: ${sum} แห่ง`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            grid: { color: &#x27;#f1f5f9&#x27; },
                            ticks: { precision: 0 }
                        },
                        y: {
                            stacked: true,
                            grid: { display: false },
                            ticks: { font: { weight: &#x27;600&#x27;, size: 12 } }
                        }
                    }
                }
            });
        }

        function renderGroupChart() {
            const groupCounts = {};
            filteredFactories.forEach(f =&gt; {
                groupCounts[f.group] = (groupCounts[f.group] || 0) + 1;
            });

            const sortedGroups = Object.entries(groupCounts).sort((a, b) =&gt; b[1] - a[1]);
            const labels = sortedGroups.map(g =&gt; g[0]);
            const data = sortedGroups.map(g =&gt; g[1]);
            const bgColors = labels.map(lbl =&gt; GROUP_COLORS[lbl] || &#x27;#64748b&#x27;);

            const ctx = document.getElementById(&#x27;groupChart&#x27;).getContext(&#x27;2d&#x27;);
            if (groupChartInstance) groupChartInstance.destroy();

            groupChartInstance = new Chart(ctx, {
                type: &#x27;doughnut&#x27;,
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: bgColors,
                        borderWidth: 2,
                        borderColor: &#x27;#ffffff&#x27;,
                        hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: &#x27;58%&#x27;,
                    onClick: (event, elements) =&gt; {
                        if (elements.length &gt; 0) {
                            const idx = elements[0].index;
                            const clickedGroup = labels[idx];
                            const select = document.getElementById(&#x27;groupFilter&#x27;);
                            if (state.group === clickedGroup) {
                                state.group = &#x27;ALL&#x27;;
                                select.value = &#x27;ALL&#x27;;
                            } else {
                                state.group = clickedGroup;
                                select.value = clickedGroup;
                            }
                            state.currentPage = 1;
                            applyFiltersAndRender();
                        }
                    },
                    onHover: (event, elements) =&gt; {
                        event.native.target.style.cursor = elements.length ? &#x27;pointer&#x27; : &#x27;default&#x27;;
                    },
                    plugins: {
                        legend: {
                            position: &#x27;right&#x27;,
                            labels: {
                                usePointStyle: true,
                                padding: 10,
                                font: { size: 11 },
                                generateLabels: (chart) =&gt; {
                                    const original = Chart.overrides.doughnut.plugins.legend.labels.generateLabels(chart);
                                    const total = chart.data.datasets[0].data.reduce((a, b) =&gt; a + b, 0);
                                    return original.map((label, i) =&gt; {
                                        const val = chart.data.datasets[0].data[i] || 0;
                                        const pct = total &gt; 0 ? ((val / total) * 100).toFixed(1) : 0;
                                        label.text = `${label.text} (${val} | ${pct}%)`;
                                        return label;
                                    });
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) =&gt; {
                                    const val = ctx.parsed;
                                    const total = ctx.dataset.data.reduce((a, b) =&gt; a + b, 0);
                                    const pct = total &gt; 0 ? ((val / total) * 100).toFixed(2) : 0;
                                    return ` ${ctx.label}: ${val} แห่ง (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderYearChart() {
            const labels = YEAR_BUCKETS.map(b =&gt; `พ.ศ. ${b.label}`);
            const activeSeries = YEAR_BUCKETS.map(() =&gt; 0);
            const pendingSeries = YEAR_BUCKETS.map(() =&gt; 0);

            filteredFactories.forEach(f =&gt; {
                const idx = YEAR_BUCKETS.findIndex(b =&gt; f.year &gt;= b.min &amp;&amp; f.year &lt;= b.max);
                if (idx !== -1) {
                    if (f.status === &#x27;แจ้งประกอบแล้ว&#x27;) activeSeries[idx]++;
                    else if (f.status === &#x27;ยังไม่แจ้งประกอบ&#x27;) pendingSeries[idx]++;
                }
            });

            const ctx = document.getElementById(&#x27;yearChart&#x27;).getContext(&#x27;2d&#x27;);
            if (yearChartInstance) yearChartInstance.destroy();

            yearChartInstance = new Chart(ctx, {
                type: &#x27;bar&#x27;,
                data: {
                    labels,
                    datasets: [
                        {
                            label: &#x27;แจ้งประกอบแล้ว&#x27;,
                            data: activeSeries,
                            backgroundColor: &#x27;#10b981&#x27;,
                            borderRadius: 4
                        },
                        {
                            label: &#x27;ยังไม่แจ้งประกอบ&#x27;,
                            data: pendingSeries,
                            backgroundColor: &#x27;#f59e0b&#x27;,
                            borderRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: &#x27;top&#x27;,
                            align: &#x27;end&#x27;,
                            labels: { usePointStyle: true, padding: 16, font: { size: 12 } }
                        },
                        tooltip: {
                            mode: &#x27;index&#x27;,
                            intersect: false,
                            callbacks: {
                                footer: (items) =&gt; {
                                    const sum = items.reduce((acc, item) =&gt; acc + item.parsed.y, 0);
                                    return `รวมช่วงปีนี้: ${sum} แห่ง`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            grid: { display: false },
                            ticks: { font: { weight: &#x27;600&#x27;, size: 12 } }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            grid: { color: &#x27;#f1f5f9&#x27; },
                            ticks: { precision: 0 }
                        }
                    }
                }
            });
        }

        // ============================================================================
        // 6. TABLE &amp; MODAL
        // ============================================================================
        function getStatusBadgeHTML(status) {
            if (status === &#x27;แจ้งประกอบแล้ว&#x27;) {
                return `&lt;span class=&quot;inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 whitespace-nowrap&quot;&gt;
                    &lt;span class=&quot;w-1.5 h-1.5 rounded-full bg-emerald-500&quot;&gt;&lt;/span&gt;แจ้งประกอบแล้ว
                &lt;/span&gt;`;
            }
            return `&lt;span class=&quot;inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 whitespace-nowrap&quot;&gt;
                &lt;span class=&quot;w-1.5 h-1.5 rounded-full bg-amber-500&quot;&gt;&lt;/span&gt;ยังไม่แจ้งประกอบ
            &lt;/span&gt;`;
        }

        function renderTable() {
            const tbody = document.getElementById(&#x27;factoryTableBody&#x27;);
            const emptyState = document.getElementById(&#x27;emptyState&#x27;);
            const total = filteredFactories.length;

            if (total === 0) {
                tbody.innerHTML = &#x27;&#x27;;
                emptyState.classList.remove(&#x27;hidden&#x27;);
                document.getElementById(&#x27;paginationInfo&#x27;).textContent = &#x27;แสดง 0 รายการ&#x27;;
                document.getElementById(&#x27;paginationControls&#x27;).innerHTML = &#x27;&#x27;;
                return;
            }

            emptyState.classList.add(&#x27;hidden&#x27;);

            const totalPages = Math.ceil(total / state.pageSize);
            if (state.currentPage &gt; totalPages) state.currentPage = totalPages;

            const startIdx = (state.currentPage - 1) * state.pageSize;
            const endIdx = Math.min(startIdx + state.pageSize, total);
            const pageSlice = filteredFactories.slice(startIdx, endIdx);

            tbody.innerHTML = pageSlice.map(item =&gt; `
                &lt;tr onclick=&quot;openDetailModal(${item.id})&quot;
                    class=&quot;hover:bg-navy-50/70 transition-colors cursor-pointer group&quot;&gt;
                    &lt;td class=&quot;py-3 px-4 font-semibold text-slate-500 whitespace-nowrap&quot;&gt;${item.id}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 font-medium text-navy-900 whitespace-nowrap&quot;&gt;${escapeHTML(item.regNo)}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 font-mono text-xs text-slate-500 whitespace-nowrap&quot;&gt;${escapeHTML(item.fid)}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 font-semibold text-slate-800 group-hover:text-navy-800&quot;&gt;
                        &lt;div class=&quot;line-clamp-2&quot;&gt;${escapeHTML(item.name)}&lt;/div&gt;
                    &lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4&quot;&gt;
                        &lt;span class=&quot;inline-block px-2 py-0.5 rounded-md text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200 mb-1&quot;&gt;
                            ${escapeHTML(item.group)}
                        &lt;/span&gt;
                        &lt;div class=&quot;text-xs text-slate-600 line-clamp-2&quot;&gt;${escapeHTML(item.business)}&lt;/div&gt;
                    &lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 font-medium text-slate-700 whitespace-nowrap&quot;&gt;${escapeHTML(item.province)}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 text-center font-semibold text-slate-700 whitespace-nowrap&quot;&gt;${item.year}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 text-center whitespace-nowrap&quot;&gt;${getStatusBadgeHTML(item.status)}&lt;/td&gt;
                &lt;/tr&gt;
            `).join(&#x27;&#x27;);

            renderPagination(total, startIdx + 1, endIdx, totalPages);
        }

        function renderPagination(total, from, to, totalPages) {
            document.getElementById(&#x27;paginationInfo&#x27;).innerHTML =
                `แสดงรายการที่ &lt;strong&gt;${from.toLocaleString()}&lt;/strong&gt; - &lt;strong&gt;${to.toLocaleString()}&lt;/strong&gt; จากทั้งหมด &lt;strong&gt;${total.toLocaleString()}&lt;/strong&gt; รายการ`;

            const container = document.getElementById(&#x27;paginationControls&#x27;);
            let html = &#x27;&#x27;;

            html += `&lt;button type=&quot;button&quot; ${state.currentPage === 1 ? &#x27;disabled&#x27; : &#x27;&#x27;} onclick=&quot;goToPage(${state.currentPage - 1})&quot;
                class=&quot;px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer&quot;&gt;
                &lt;i class=&quot;fa-solid fa-chevron-left&quot;&gt;&lt;/i&gt;
            &lt;/button&gt;`;

            for (let i = 1; i &lt;= totalPages; i++) {
                const active = i === state.currentPage;
                html += `&lt;button type=&quot;button&quot; onclick=&quot;goToPage(${i})&quot;
                    class=&quot;px-3 py-1.5 rounded-lg border text-xs font-semibold transition cursor-pointer ${
                        active
                            ? &#x27;bg-navy-900 text-white border-navy-900 shadow-xs&#x27;
                            : &#x27;bg-white text-slate-700 border-slate-300 hover:bg-slate-100&#x27;
                    }&quot;&gt;
                    ${i}
                &lt;/button&gt;`;
            }

            html += `&lt;button type=&quot;button&quot; ${state.currentPage === totalPages ? &#x27;disabled&#x27; : &#x27;&#x27;} onclick=&quot;goToPage(${state.currentPage + 1})&quot;
                class=&quot;px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer&quot;&gt;
                &lt;i class=&quot;fa-solid fa-chevron-right&quot;&gt;&lt;/i&gt;
            &lt;/button&gt;`;

            container.innerHTML = html;
        }

        function goToPage(page) {
            state.currentPage = page;
            renderTable();
        }

        function openDetailModal(factoryId) {
            const factory = ALL_FACTORIES.find(f =&gt; f.id === factoryId);
            if (!factory) return;

            document.getElementById(&#x27;modalId&#x27;).textContent = factory.id;
            document.getElementById(&#x27;modalName&#x27;).textContent = factory.name;
            document.getElementById(&#x27;modalStatusBadge&#x27;).innerHTML = getStatusBadgeHTML(factory.status);
            document.getElementById(&#x27;modalRegNo&#x27;).textContent = factory.regNo;
            document.getElementById(&#x27;modalFid&#x27;).textContent = factory.fid;
            document.getElementById(&#x27;modalProvince&#x27;).textContent = factory.province;
            document.getElementById(&#x27;modalYear&#x27;).textContent = `พ.ศ. ${factory.year}`;
            document.getElementById(&#x27;modalGroup&#x27;).textContent = factory.group;
            document.getElementById(&#x27;modalBusiness&#x27;).textContent = factory.business;

            const modal = document.getElementById(&#x27;detailModal&#x27;);
            modal.classList.remove(&#x27;hidden&#x27;);
            modal.classList.add(&#x27;flex&#x27;);
        }

        function closeModal() {
            const modal = document.getElementById(&#x27;detailModal&#x27;);
            modal.classList.add(&#x27;hidden&#x27;);
            modal.classList.remove(&#x27;flex&#x27;);
        }

        // ============================================================================
        // 7. CSV EXPORT
        // ============================================================================
        function exportFilteredCSV() {
            if (filteredFactories.length === 0) {
                showToast(&#x27;ไม่มีข้อมูลสำหรับส่งออก&#x27;);
                return;
            }

            const headers = [&#x27;ลำดับ&#x27;, &#x27;เลขทะเบียน&#x27;, &#x27;FID&#x27;, &#x27;ชื่อโรงงาน&#x27;, &#x27;กลุ่มประเภทกิจการ&#x27;, &#x27;ลักษณะการประกอบกิจการ&#x27;, &#x27;จังหวัด&#x27;, &#x27;ปีที่อนุญาต (พ.ศ.)&#x27;, &#x27;สถานะ&#x27;];
            const escapeCSV = (val) =&gt; `&quot;${String(val ?? &#x27;&#x27;).replace(/&quot;/g, &#x27;&quot;&quot;&#x27;)}&quot;`;

            const csvRows = [
                headers.map(escapeCSV).join(&#x27;,&#x27;),
                ...filteredFactories.map(f =&gt; [
                    f.id, f.regNo, f.fid, f.name, f.group, f.business, f.province, f.year, f.status
                ].map(escapeCSV).join(&#x27;,&#x27;))
            ];

            const csvContent = &#x27;\uFEFF&#x27; + csvRows.join(&#x27;\r\n&#x27;);
            const blob = new Blob([csvContent], { type: &#x27;text/csv;charset=utf-8;&#x27; });
            const url = URL.createObjectURL(blob);

            const link = document.createElement(&#x27;a&#x27;);
            link.href = url;
            link.setAttribute(&#x27;download&#x27;, `รายงานโรงงาน_7(3)_${filteredFactories.length}_แห่ง.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(`ส่งออกไฟล์ CSV จำนวน ${filteredFactories.length} รายการเรียบร้อยแล้ว`);
        }

        function showToast(message) {
            const toast = document.getElementById(&#x27;toastNotification&#x27;);
            document.getElementById(&#x27;toastMessage&#x27;).textContent = message;
            toast.classList.remove(&#x27;hidden&#x27;);
            toast.classList.add(&#x27;flex&#x27;);
            setTimeout(() =&gt; {
                toast.classList.add(&#x27;hidden&#x27;);
                toast.classList.remove(&#x27;flex&#x27;);
            }, 3200);
        }

        function escapeHTML(str) {
            return String(str ?? &#x27;&#x27;)
                .replace(/&amp;/g, &#x27;&amp;amp;&#x27;)
                .replace(/&lt;/g, &#x27;&amp;lt;&#x27;)
                .replace(/&gt;/g, &#x27;&amp;gt;&#x27;)
                .replace(/&quot;/g, &#x27;&amp;quot;&#x27;)
                .replace(/&#x27;/g, &#x27;&amp;#039;&#x27;);
        }

            { id: 51, regNo: &quot;3-7(4)-1/45สฎ&quot;, fid: &quot;10840100125456&quot;, name: &quot;บริษัท ท่าเรือราชาเฟอร์รี่ จำกัด (มหาชน)&quot;, business: &quot;ทำน้ำมันจากพืช หรือ สัตว์ให้บริสุทธิ์ (สำหรับผสมกับไบโอดีเซล)&quot;, province: &quot;สุราษฎร์ธานี&quot;, status: &quot;หยุดชั่วคราว&quot;, year: 2545, group: &quot;ไบโอดีเซล&quot; },
            { id: 52, regNo: &quot;ส3-7(4)-1/29สฎ&quot;, fid: &quot;00840000125293&quot;, name: &quot;บริษัท สห นีโอ ฟู้ด แอนด์ ออยล์ จำกัด&quot;, business: &quot;การทำน้ำมันจากพืชให้บริสุทธิ์ (RBD Palm Olein, RBD Plam Stearine)&quot;, province: &quot;สุราษฎร์ธานี&quot;, status: &quot;หยุดชั่วคราว&quot;, year: 2529, group: &quot;ทำน้ำมันพืชให้บริสุทธิ์&quot; }
        ];

        // ============================================================================
        // STATE &amp; FILTER LOGIC
        // ============================================================================
        const state = {
            search: &#x27;&#x27;,
            province: &#x27;ALL&#x27;,
            statuses: new Set(),
            group: &#x27;ALL&#x27;,
            sortKey: &#x27;id&#x27;,
            sortAsc: true,
            currentPage: 1,
            pageSize: 15
        };

        let filteredFactories = [...ALL_FACTORIES];
        let provinceChartInstance = null;
        let groupChartInstance = null;
        let yearChartInstance = null;
        let searchDebounceTimer = null;

        const YEAR_BUCKETS = [
            { label: &#x27;2510–2519&#x27;, min: 2510, max: 2519 },
            { label: &#x27;2520–2529&#x27;, min: 2520, max: 2529 },
            { label: &#x27;2530–2539&#x27;, min: 2530, max: 2539 },
            { label: &#x27;2540–2549&#x27;, min: 2540, max: 2549 },
            { label: &#x27;2550–2559&#x27;, min: 2550, max: 2559 },
            { label: &#x27;2560–2569&#x27;, min: 2560, max: 2569 }
        ];

        const GROUP_COLORS = {
            &#x27;ทำน้ำมันพืชให้บริสุทธิ์&#x27;: &#x27;#0f766e&#x27;,
            &#x27;ไบโอดีเซล&#x27;: &#x27;#0284c7&#x27;,
            &#x27;น้ำมันปาล์ม/กลั่นบริสุทธิ์&#x27;: &#x27;#eab308&#x27;,
            &#x27;น้ำมันรำข้าวบริสุทธิ์&#x27;: &#x27;#7c3aed&#x27;,
            &#x27;น้ำมันพืชเฉพาะทาง/อื่นๆ&#x27;: &#x27;#e11d48&#x27;,
            &#x27;น้ำมันประกอบอาหารใช้แล้ว (UCO)&#x27;: &#x27;#9333ea&#x27;,
            &#x27;น้ำมันพืชเฉพาะทาง (ถั่วดาวอินคา)&#x27;: &#x27;#65a30d&#x27;,
            &#x27;น้ำมัน/ไขมันจากสัตว์&#x27;: &#x27;#475569&#x27;
        };

        // ============================================================================
        // INITIALIZATION
        // ============================================================================
        document.addEventListener(&#x27;DOMContentLoaded&#x27;, () =&gt; {
            populateDropdowns();
            bindEvents();
            Chart.defaults.font.family = &quot;&#x27;Sarabun&#x27;, sans-serif&quot;;
            applyFiltersAndRender();
        });

        function populateDropdowns() {
            const provSelect = document.getElementById(&#x27;provinceFilter&#x27;);
            const counts = {};
            ALL_FACTORIES.forEach(f =&gt; { counts[f.province] = (counts[f.province] || 0) + 1; });
            const sortedProvinces = [...new Set(ALL_FACTORIES.map(f =&gt; f.province))].sort((a, b) =&gt; a.localeCompare(b, &#x27;th&#x27;));
            sortedProvinces.forEach(prov =&gt; {
                const opt = document.createElement(&#x27;option&#x27;);
                opt.value = prov;
                opt.textContent = `${prov} (${counts[prov] || 0} แห่ง)`;
                provSelect.appendChild(opt);
            });

            const groupSelect = document.getElementById(&#x27;groupFilter&#x27;);
            const groupCounts = {};
            ALL_FACTORIES.forEach(f =&gt; { groupCounts[f.group] = (groupCounts[f.group] || 0) + 1; });
            const sortedGroups = [...new Set(ALL_FACTORIES.map(f =&gt; f.group))].sort((a, b) =&gt; a.localeCompare(b, &#x27;th&#x27;));
            sortedGroups.forEach(grp =&gt; {
                const opt = document.createElement(&#x27;option&#x27;);
                opt.value = grp;
                opt.textContent = `${grp} (${groupCounts[grp] || 0} แห่ง)`;
                groupSelect.appendChild(opt);
            });
        }

        function bindEvents() {
            const searchInput = document.getElementById(&#x27;searchInput&#x27;);
            const btnClearSearch = document.getElementById(&#x27;btnClearSearch&#x27;);
            searchInput.addEventListener(&#x27;input&#x27;, (e) =&gt; {
                const val = e.target.value.trim();
                btnClearSearch.classList.toggle(&#x27;hidden&#x27;, val.length === 0);
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() =&gt; {
                    state.search = val;
                    state.currentPage = 1;
                    applyFiltersAndRender();
                }, 150);
            });

            btnClearSearch.addEventListener(&#x27;click&#x27;, () =&gt; {
                clearTimeout(searchDebounceTimer);
                searchInput.value = &#x27;&#x27;;
                state.search = &#x27;&#x27;;
                btnClearSearch.classList.add(&#x27;hidden&#x27;);
                state.currentPage = 1;
                applyFiltersAndRender();
            });

            document.getElementById(&#x27;provinceFilter&#x27;).addEventListener(&#x27;change&#x27;, (e) =&gt; {
                state.province = e.target.value;
                state.currentPage = 1;
                applyFiltersAndRender();
            });

            document.getElementById(&#x27;groupFilter&#x27;).addEventListener(&#x27;change&#x27;, (e) =&gt; {
                state.group = e.target.value;
                state.currentPage = 1;
                applyFiltersAndRender();
            });

            document.querySelectorAll(&#x27;.status-pill&#x27;).forEach(btn =&gt; {
                btn.addEventListener(&#x27;click&#x27;, () =&gt; {
                    const statusVal = btn.getAttribute(&#x27;data-status&#x27;);
                    if (statusVal === &#x27;ALL&#x27;) {
                        state.statuses.clear();
                    } else {
                        if (state.statuses.has(statusVal)) {
                            state.statuses.delete(statusVal);
                        } else {
                            state.statuses.add(statusVal);
                        }
                        if (state.statuses.size === 3) {
                            state.statuses.clear();
                        }
                    }
                    updateStatusPillsUI();
                    state.currentPage = 1;
                    applyFiltersAndRender();
                });
            });

            document.getElementById(&#x27;btnResetFilters&#x27;).addEventListener(&#x27;click&#x27;, resetAllFilters);
            document.getElementById(&#x27;btnExportCSV&#x27;).addEventListener(&#x27;click&#x27;, exportFilteredCSV);
            document.getElementById(&#x27;pageSizeSelect&#x27;).addEventListener(&#x27;change&#x27;, (e) =&gt; {
                const val = e.target.value;
                state.pageSize = val === &#x27;ทั้งหมด&#x27; ? ALL_FACTORIES.length : parseInt(val, 10);
                state.currentPage = 1;
                renderTable();
            });

            document.querySelectorAll(&#x27;.sort-header&#x27;).forEach(th =&gt; {
                th.addEventListener(&#x27;click&#x27;, () =&gt; {
                    const key = th.getAttribute(&#x27;data-sort&#x27;);
                    if (state.sortKey === key) {
                        state.sortAsc = !state.sortAsc;
                    } else {
                        state.sortKey = key;
                        state.sortAsc = true;
                    }
                    updateSortIcons();
                    sortFilteredData();
                    renderTable();
                });
            });

            document.getElementById(&#x27;btnCloseModalTop&#x27;).addEventListener(&#x27;click&#x27;, closeModal);
            document.getElementById(&#x27;btnCloseModalBottom&#x27;).addEventListener(&#x27;click&#x27;, closeModal);
            document.getElementById(&#x27;detailModal&#x27;).addEventListener(&#x27;click&#x27;, (e) =&gt; {
                if (e.target.id === &#x27;detailModal&#x27;) closeModal();
            });
            document.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
                if (e.key === &#x27;Escape&#x27;) closeModal();
            });
        }

        function updateStatusPillsUI() {
            const isAll = state.statuses.size === 0;
            document.querySelectorAll(&#x27;.status-pill&#x27;).forEach(btn =&gt; {
                const st = btn.getAttribute(&#x27;data-status&#x27;);
                const active = (st === &#x27;ALL&#x27; &amp;&amp; isAll) || (st !== &#x27;ALL&#x27; &amp;&amp; state.statuses.has(st));

                btn.className = &#x27;status-pill px-3.5 py-2 rounded-xl text-sm font-medium border transition-all cursor-pointer &#x27;;
                if (active) {
                    if (st === &#x27;ALL&#x27;) {
                        btn.className += &#x27;bg-navy-900 text-white border-navy-900 shadow-sm&#x27;;
                    } else if (st === &#x27;แจ้งประกอบแล้ว&#x27;) {
                        btn.className += &#x27;bg-emerald-600 text-white border-emerald-600 shadow-sm&#x27;;
                    } else if (st === &#x27;ยังไม่แจ้งประกอบ&#x27;) {
                        btn.className += &#x27;bg-amber-500 text-white border-amber-500 shadow-sm&#x27;;
                    } else if (st === &#x27;หยุดชั่วคราว&#x27;) {
                        btn.className += &#x27;bg-rose-600 text-white border-rose-600 shadow-sm&#x27;;
                    }
                } else {
                    btn.className += &#x27;bg-white text-slate-700 border-slate-200 hover:bg-slate-50&#x27;;
                }
            });
        }

        function resetAllFilters() {
            clearTimeout(searchDebounceTimer);
            state.search = &#x27;&#x27;;
            state.province = &#x27;ALL&#x27;;
            state.statuses.clear();
            state.group = &#x27;ALL&#x27;;
            state.sortKey = &#x27;id&#x27;;
            state.sortAsc = true;
            state.currentPage = 1;

            document.getElementById(&#x27;searchInput&#x27;).value = &#x27;&#x27;;
            document.getElementById(&#x27;btnClearSearch&#x27;).classList.add(&#x27;hidden&#x27;);
            document.getElementById(&#x27;provinceFilter&#x27;).value = &#x27;ALL&#x27;;
            document.getElementById(&#x27;groupFilter&#x27;).value = &#x27;ALL&#x27;;

            updateStatusPillsUI();
            updateSortIcons();
            applyFiltersAndRender();
        }

        // ============================================================================
        // FILTER &amp; RENDER
        // ============================================================================
        function applyFiltersAndRender() {
            const q = state.search.toLowerCase();

            filteredFactories = ALL_FACTORIES.filter(item =&gt; {
                if (state.province !== &#x27;ALL&#x27; &amp;&amp; item.province !== state.province) return false;
                if (state.statuses.size &gt; 0 &amp;&amp; !state.statuses.has(item.status)) return false;
                if (state.group !== &#x27;ALL&#x27; &amp;&amp; item.group !== state.group) return false;

                if (q) {
                    const haystack = `${item.name} ${item.regNo} ${item.fid} ${item.business} ${item.province}`.toLowerCase();
                    if (!haystack.includes(q)) return false;
                }
                return true;
            });

            sortFilteredData();
            updateKPIs();
            renderCharts();
            renderTable();
        }

        function sortFilteredData() {
            const key = state.sortKey;
            const dir = state.sortAsc ? 1 : -1;

            filteredFactories.sort((a, b) =&gt; {
                const valA = a[key];
                const valB = b[key];
                if (typeof valA === &#x27;number&#x27; &amp;&amp; typeof valB === &#x27;number&#x27;) {
                    return (valA - valB) * dir;
                }
                return String(valA).localeCompare(String(valB), &#x27;th&#x27;) * dir;
            });
        }

        function updateSortIcons() {
            document.querySelectorAll(&#x27;.sort-header&#x27;).forEach(th =&gt; {
                const key = th.getAttribute(&#x27;data-sort&#x27;);
                const icon = th.querySelector(&#x27;i&#x27;);
                if (key === state.sortKey) {
                    icon.className = state.sortAsc
                        ? &#x27;fa-solid fa-sort-up ml-1 text-amber-400&#x27;
                        : &#x27;fa-solid fa-sort-down ml-1 text-amber-400&#x27;;
                } else {
                    icon.className = &#x27;fa-solid fa-sort ml-1 text-slate-400&#x27;;
                }
            });
        }

        function updateKPIs() {
            const total = filteredFactories.length;
            const activeCount = filteredFactories.filter(f =&gt; f.status === &#x27;แจ้งประกอบแล้ว&#x27;).length;
            const pendingCount = filteredFactories.filter(f =&gt; f.status === &#x27;ยังไม่แจ้งประกอบ&#x27;).length;
            const stoppedCount = filteredFactories.filter(f =&gt; f.status === &#x27;หยุดชั่วคราว&#x27;).length;
            const uniqueProvinces = new Set(filteredFactories.map(f =&gt; f.province)).size;

            const pct = (n) =&gt; total &gt; 0 ? ((n / total) * 100).toFixed(2) + &#x27;%&#x27; : &#x27;0.00%&#x27;;
            const shareOfAll = ((total / ALL_FACTORIES.length) * 100).toFixed(2) + &#x27;%&#x27;;

            document.getElementById(&#x27;kpiTotal&#x27;).textContent = total.toLocaleString();
            document.getElementById(&#x27;kpiTotalPct&#x27;).textContent = shareOfAll;

            document.getElementById(&#x27;kpiActive&#x27;).textContent = activeCount.toLocaleString();
            document.getElementById(&#x27;kpiActivePct&#x27;).textContent = pct(activeCount);

            document.getElementById(&#x27;kpiPending&#x27;).textContent = pendingCount.toLocaleString();
            document.getElementById(&#x27;kpiPendingPct&#x27;).textContent = pct(pendingCount);

            document.getElementById(&#x27;kpiStopped&#x27;).textContent = stoppedCount.toLocaleString();
            document.getElementById(&#x27;kpiStoppedPct&#x27;).textContent = pct(stoppedCount);

            const badge = document.getElementById(&#x27;activeFilterBadge&#x27;);
            if (total === ALL_FACTORIES.length) {
                badge.innerHTML = `กำลังแสดงข้อมูลทั้งหมด &lt;strong class=&quot;text-navy-800&quot;&gt;${total}&lt;/strong&gt; แห่ง (22 จังหวัด)`;
            } else {
                badge.innerHTML = `ผลลัพธ์การกรอง: &lt;strong class=&quot;text-navy-800&quot;&gt;${total}&lt;/strong&gt; แห่ง จากทั้งหมด 52 แห่ง (${uniqueProvinces} จังหวัด)`;
            }
        }

        // ============================================================================
        // CHARTS (CHART.JS) - SUPPORTING ALL 3 STATUSES
        // ============================================================================
        function renderCharts() {
            renderProvinceChart();
            renderGroupChart();
            renderYearChart();
        }

        function renderProvinceChart() {
            const provStats = {};
            filteredFactories.forEach(f =&gt; {
                if (!provStats[f.province]) {
                    provStats[f.province] = { total: 0, active: 0, pending: 0, stopped: 0 };
                }
                provStats[f.province].total++;
                if (f.status === &#x27;แจ้งประกอบแล้ว&#x27;) provStats[f.province].active++;
                else if (f.status === &#x27;ยังไม่แจ้งประกอบ&#x27;) provStats[f.province].pending++;
                else if (f.status === &#x27;หยุดชั่วคราว&#x27;) provStats[f.province].stopped++;
            });

            const top10 = Object.entries(provStats)
                .sort((a, b) =&gt; b[1].total - a[1].total || a[0].localeCompare(b[0], &#x27;th&#x27;))
                .slice(0, 10);

            const labels = top10.map(d =&gt; d[0]);
            const activeData = top10.map(d =&gt; d[1].active);
            const pendingData = top10.map(d =&gt; d[1].pending);
            const stoppedData = top10.map(d =&gt; d[1].stopped);

            const ctx = document.getElementById(&#x27;provinceChart&#x27;).getContext(&#x27;2d&#x27;);
            if (provinceChartInstance) provinceChartInstance.destroy();

            provinceChartInstance = new Chart(ctx, {
                type: &#x27;bar&#x27;,
                data: {
                    labels,
                    datasets: [
                        { label: &#x27;แจ้งประกอบแล้ว&#x27;, data: activeData, backgroundColor: &#x27;#10b981&#x27;, borderRadius: 4 },
                        { label: &#x27;ยังไม่แจ้งประกอบ&#x27;, data: pendingData, backgroundColor: &#x27;#f59e0b&#x27;, borderRadius: 4 },
                        { label: &#x27;หยุดชั่วคราว&#x27;, data: stoppedData, backgroundColor: &#x27;#f43f5e&#x27;, borderRadius: 4 }
                    ]
                },
                options: {
                    indexAxis: &#x27;y&#x27;,
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (event, elements) =&gt; {
                        if (elements.length &gt; 0) {
                            const idx = elements[0].index;
                            const clickedProv = labels[idx];
                            const select = document.getElementById(&#x27;provinceFilter&#x27;);
                            if (state.province === clickedProv) {
                                state.province = &#x27;ALL&#x27;;
                                select.value = &#x27;ALL&#x27;;
                            } else {
                                state.province = clickedProv;
                                select.value = clickedProv;
                            }
                            state.currentPage = 1;
                            applyFiltersAndRender();
                        }
                    },
                    onHover: (event, elements) =&gt; {
                        event.native.target.style.cursor = elements.length ? &#x27;pointer&#x27; : &#x27;default&#x27;;
                    },
                    plugins: {
                        legend: { position: &#x27;bottom&#x27;, labels: { usePointStyle: true, padding: 16, font: { size: 12 } } },
                        tooltip: {
                            mode: &#x27;index&#x27;,
                            intersect: false,
                            callbacks: {
                                footer: (items) =&gt; {
                                    const sum = items.reduce((acc, item) =&gt; acc + item.parsed.x, 0);
                                    return `รวมทั้งหมด: ${sum} แห่ง`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { stacked: true, grid: { color: &#x27;#f1f5f9&#x27; }, ticks: { precision: 0 } },
                        y: { stacked: true, grid: { display: false }, ticks: { font: { weight: &#x27;600&#x27;, size: 12 } } }
                    }
                }
            });
        }

        function renderGroupChart() {
            const groupCounts = {};
            filteredFactories.forEach(f =&gt; {
                groupCounts[f.group] = (groupCounts[f.group] || 0) + 1;
            });

            const sortedGroups = Object.entries(groupCounts).sort((a, b) =&gt; b[1] - a[1]);
            const labels = sortedGroups.map(g =&gt; g[0]);
            const data = sortedGroups.map(g =&gt; g[1]);
            const bgColors = labels.map(lbl =&gt; GROUP_COLORS[lbl] || &#x27;#64748b&#x27;);

            const ctx = document.getElementById(&#x27;groupChart&#x27;).getContext(&#x27;2d&#x27;);
            if (groupChartInstance) groupChartInstance.destroy();

            groupChartInstance = new Chart(ctx, {
                type: &#x27;doughnut&#x27;,
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: bgColors,
                        borderWidth: 2,
                        borderColor: &#x27;#ffffff&#x27;,
                        hoverOffset: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: &#x27;58%&#x27;,
                    onClick: (event, elements) =&gt; {
                        if (elements.length &gt; 0) {
                            const idx = elements[0].index;
                            const clickedGroup = labels[idx];
                            const select = document.getElementById(&#x27;groupFilter&#x27;);
                            if (state.group === clickedGroup) {
                                state.group = &#x27;ALL&#x27;;
                                select.value = &#x27;ALL&#x27;;
                            } else {
                                state.group = clickedGroup;
                                select.value = clickedGroup;
                            }
                            state.currentPage = 1;
                            applyFiltersAndRender();
                        }
                    },
                    onHover: (event, elements) =&gt; {
                        event.native.target.style.cursor = elements.length ? &#x27;pointer&#x27; : &#x27;default&#x27;;
                    },
                    plugins: {
                        legend: {
                            position: &#x27;right&#x27;,
                            labels: {
                                usePointStyle: true,
                                padding: 10,
                                font: { size: 11 },
                                generateLabels: (chart) =&gt; {
                                    const original = Chart.overrides.doughnut.plugins.legend.labels.generateLabels(chart);
                                    const total = chart.data.datasets[0].data.reduce((a, b) =&gt; a + b, 0);
                                    return original.map((label, i) =&gt; {
                                        const val = chart.data.datasets[0].data[i] || 0;
                                        const pct = total &gt; 0 ? ((val / total) * 100).toFixed(1) : 0;
                                        label.text = `${label.text} (${val} | ${pct}%)`;
                                        return label;
                                    });
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: (ctx) =&gt; {
                                    const val = ctx.parsed;
                                    const total = ctx.dataset.data.reduce((a, b) =&gt; a + b, 0);
                                    const pct = total &gt; 0 ? ((val / total) * 100).toFixed(2) : 0;
                                    return ` ${ctx.label}: ${val} แห่ง (${pct}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderYearChart() {
            const labels = YEAR_BUCKETS.map(b =&gt; `พ.ศ. ${b.label}`);
            const activeSeries = YEAR_BUCKETS.map(() =&gt; 0);
            const pendingSeries = YEAR_BUCKETS.map(() =&gt; 0);
            const stoppedSeries = YEAR_BUCKETS.map(() =&gt; 0);

            filteredFactories.forEach(f =&gt; {
                const idx = YEAR_BUCKETS.findIndex(b =&gt; f.year &gt;= b.min &amp;&amp; f.year &lt;= b.max);
                if (idx !== -1) {
                    if (f.status === &#x27;แจ้งประกอบแล้ว&#x27;) activeSeries[idx]++;
                    else if (f.status === &#x27;ยังไม่แจ้งประกอบ&#x27;) pendingSeries[idx]++;
                    else if (f.status === &#x27;หยุดชั่วคราว&#x27;) stoppedSeries[idx]++;
                }
            });

            const ctx = document.getElementById(&#x27;yearChart&#x27;).getContext(&#x27;2d&#x27;);
            if (yearChartInstance) yearChartInstance.destroy();

            yearChartInstance = new Chart(ctx, {
                type: &#x27;bar&#x27;,
                data: {
                    labels,
                    datasets: [
                        { label: &#x27;แจ้งประกอบแล้ว&#x27;, data: activeSeries, backgroundColor: &#x27;#10b981&#x27;, borderRadius: 4 },
                        { label: &#x27;ยังไม่แจ้งประกอบ&#x27;, data: pendingSeries, backgroundColor: &#x27;#f59e0b&#x27;, borderRadius: 4 },
                        { label: &#x27;หยุดชั่วคราว&#x27;, data: stoppedSeries, backgroundColor: &#x27;#f43f5e&#x27;, borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: &#x27;top&#x27;, align: &#x27;end&#x27;, labels: { usePointStyle: true, padding: 16, font: { size: 12 } } },
                        tooltip: {
                            mode: &#x27;index&#x27;,
                            intersect: false,
                            callbacks: {
                                footer: (items) =&gt; {
                                    const sum = items.reduce((acc, item) =&gt; acc + item.parsed.y, 0);
                                    return `รวมช่วงปีนี้: ${sum} แห่ง`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { font: { weight: &#x27;600&#x27;, size: 12 } } },
                        y: { stacked: true, beginAtZero: true, grid: { color: &#x27;#f1f5f9&#x27; }, ticks: { precision: 0 } }
                    }
                }
            });
        }

        // ============================================================================
        // TABLE &amp; MODAL
        // ============================================================================
        function getStatusBadgeHTML(status) {
            if (status === &#x27;แจ้งประกอบแล้ว&#x27;) {
                return `&lt;span class=&quot;inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 whitespace-nowrap&quot;&gt;
                    &lt;span class=&quot;w-1.5 h-1.5 rounded-full bg-emerald-500&quot;&gt;&lt;/span&gt;แจ้งประกอบแล้ว
                &lt;/span&gt;`;
            } else if (status === &#x27;ยังไม่แจ้งประกอบ&#x27;) {
                return `&lt;span class=&quot;inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 whitespace-nowrap&quot;&gt;
                    &lt;span class=&quot;w-1.5 h-1.5 rounded-full bg-amber-500&quot;&gt;&lt;/span&gt;ยังไม่แจ้งประกอบ
                &lt;/span&gt;`;
            } else {
                return `&lt;span class=&quot;inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200 whitespace-nowrap&quot;&gt;
                    &lt;span class=&quot;w-1.5 h-1.5 rounded-full bg-rose-500&quot;&gt;&lt;/span&gt;หยุดชั่วคราว
                &lt;/span&gt;`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById(&#x27;factoryTableBody&#x27;);
            const emptyState = document.getElementById(&#x27;emptyState&#x27;);
            const total = filteredFactories.length;

            if (total === 0) {
                tbody.innerHTML = &#x27;&#x27;;
                emptyState.classList.remove(&#x27;hidden&#x27;);
                document.getElementById(&#x27;paginationInfo&#x27;).textContent = &#x27;แสดง 0 รายการ&#x27;;
                document.getElementById(&#x27;paginationControls&#x27;).innerHTML = &#x27;&#x27;;
                return;
            }

            emptyState.classList.add(&#x27;hidden&#x27;);

            const totalPages = Math.ceil(total / state.pageSize);
            if (state.currentPage &gt; totalPages) state.currentPage = totalPages;

            const startIdx = (state.currentPage - 1) * state.pageSize;
            const endIdx = Math.min(startIdx + state.pageSize, total);
            const pageSlice = filteredFactories.slice(startIdx, endIdx);

            tbody.innerHTML = pageSlice.map(item =&gt; `
                &lt;tr onclick=&quot;openDetailModal(${item.id})&quot;
                    class=&quot;hover:bg-navy-50/70 transition-colors cursor-pointer group&quot;&gt;
                    &lt;td class=&quot;py-3 px-4 font-semibold text-slate-500 whitespace-nowrap&quot;&gt;${item.id}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 font-medium text-navy-900 whitespace-nowrap&quot;&gt;${escapeHTML(item.regNo)}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 font-mono text-xs text-slate-500 whitespace-nowrap&quot;&gt;${escapeHTML(item.fid)}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 font-semibold text-slate-800 group-hover:text-navy-800&quot;&gt;
                        &lt;div class=&quot;line-clamp-2&quot;&gt;${escapeHTML(item.name)}&lt;/div&gt;
                    &lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4&quot;&gt;
                        &lt;span class=&quot;inline-block px-2 py-0.5 rounded-md text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200 mb-1&quot;&gt;
                            ${escapeHTML(item.group)}
                        &lt;/span&gt;
                        &lt;div class=&quot;text-xs text-slate-600 line-clamp-2&quot;&gt;${escapeHTML(item.business)}&lt;/div&gt;
                    &lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 font-medium text-slate-700 whitespace-nowrap&quot;&gt;${escapeHTML(item.province)}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 text-center font-semibold text-slate-700 whitespace-nowrap&quot;&gt;${item.year}&lt;/td&gt;
                    &lt;td class=&quot;py-3 px-4 text-center whitespace-nowrap&quot;&gt;${getStatusBadgeHTML(item.status)}&lt;/td&gt;
                &lt;/tr&gt;
            `).join(&#x27;&#x27;);

            renderPagination(total, startIdx + 1, endIdx, totalPages);
        }

        function renderPagination(total, from, to, totalPages) {
            document.getElementById(&#x27;paginationInfo&#x27;).innerHTML =
                `แสดงรายการที่ &lt;strong&gt;${from.toLocaleString()}&lt;/strong&gt; - &lt;strong&gt;${to.toLocaleString()}&lt;/strong&gt; จากทั้งหมด &lt;strong&gt;${total.toLocaleString()}&lt;/strong&gt; รายการ`;

            const container = document.getElementById(&#x27;paginationControls&#x27;);
            let html = &#x27;&#x27;;

            html += `&lt;button type=&quot;button&quot; ${state.currentPage === 1 ? &#x27;disabled&#x27; : &#x27;&#x27;} onclick=&quot;goToPage(${state.currentPage - 1})&quot;
                class=&quot;px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer&quot;&gt;
                &lt;i class=&quot;fa-solid fa-chevron-left&quot;&gt;&lt;/i&gt;
            &lt;/button&gt;`;

            for (let i = 1; i &lt;= totalPages; i++) {
                const active = i === state.currentPage;
                html += `&lt;button type=&quot;button&quot; onclick=&quot;goToPage(${i})&quot;
                    class=&quot;px-3 py-1.5 rounded-lg border text-xs font-semibold transition cursor-pointer ${
                        active
                            ? &#x27;bg-navy-900 text-white border-navy-900 shadow-xs&#x27;
                            : &#x27;bg-white text-slate-700 border-slate-300 hover:bg-slate-100&#x27;
                    }&quot;&gt;
                    ${i}
                &lt;/button&gt;`;
            }

            html += `&lt;button type=&quot;button&quot; ${state.currentPage === totalPages ? &#x27;disabled&#x27; : &#x27;&#x27;} onclick=&quot;goToPage(${state.currentPage + 1})&quot;
                class=&quot;px-2.5 py-1.5 rounded-lg border border-slate-300 bg-white text-slate-700 hover:bg-slate-100 disabled:opacity-40 disabled:pointer-events-none cursor-pointer&quot;&gt;
                &lt;i class=&quot;fa-solid fa-chevron-right&quot;&gt;&lt;/i&gt;
            &lt;/button&gt;`;

            container.innerHTML = html;
        }

        function goToPage(page) {
            state.currentPage = page;
            renderTable();
        }

        function openDetailModal(factoryId) {
            const factory = ALL_FACTORIES.find(f =&gt; f.id === factoryId);
            if (!factory) return;

            document.getElementById(&#x27;modalId&#x27;).textContent = factory.id;
            document.getElementById(&#x27;modalName&#x27;).textContent = factory.name;
            document.getElementById(&#x27;modalStatusBadge&#x27;).innerHTML = getStatusBadgeHTML(factory.status);
            document.getElementById(&#x27;modalRegNo&#x27;).textContent = factory.regNo;
            document.getElementById(&#x27;modalFid&#x27;).textContent = factory.fid;
            document.getElementById(&#x27;modalProvince&#x27;).textContent = factory.province;
            document.getElementById(&#x27;modalYear&#x27;).textContent = `พ.ศ. ${factory.year}`;
            document.getElementById(&#x27;modalGroup&#x27;).textContent = factory.group;
            document.getElementById(&#x27;modalBusiness&#x27;).textContent = factory.business;

            const modal = document.getElementById(&#x27;detailModal&#x27;);
            modal.classList.remove(&#x27;hidden&#x27;);
            modal.classList.add(&#x27;flex&#x27;);
        }

        function closeModal() {
            const modal = document.getElementById(&#x27;detailModal&#x27;);
            modal.classList.add(&#x27;hidden&#x27;);
            modal.classList.remove(&#x27;flex&#x27;);
        }

        // ============================================================================
        // CSV EXPORT &amp; TOAST
        // ============================================================================
        function exportFilteredCSV() {
            if (filteredFactories.length === 0) {
                showToast(&#x27;ไม่มีข้อมูลสำหรับส่งออก&#x27;);
                return;
            }

            const headers = [&#x27;ลำดับ&#x27;, &#x27;เลขทะเบียน&#x27;, &#x27;FID&#x27;, &#x27;ชื่อโรงงาน&#x27;, &#x27;กลุ่มประเภทกิจการ&#x27;, &#x27;ลักษณะการประกอบกิจการ&#x27;, &#x27;จังหวัด&#x27;, &#x27;ปีที่อนุญาต (พ.ศ.)&#x27;, &#x27;สถานะ&#x27;];
            const escapeCSV = (val) =&gt; `&quot;${String(val ?? &#x27;&#x27;).replace(/&quot;/g, &#x27;&quot;&quot;&#x27;)}&quot;`;

            const csvRows = [
                headers.map(escapeCSV).join(&#x27;,&#x27;),
                ...filteredFactories.map(f =&gt; [
                    f.id, f.regNo, f.fid, f.name, f.group, f.business, f.province, f.year, f.status
                ].map(escapeCSV).join(&#x27;,&#x27;))
            ];

            const csvContent = &#x27;\uFEFF&#x27; + csvRows.join(&#x27;\r\n&#x27;);
            const blob = new Blob([csvContent], { type: &#x27;text/csv;charset=utf-8;&#x27; });
            const url = URL.createObjectURL(blob);

            const link = document.createElement(&#x27;a&#x27;);
            link.href = url;
            link.setAttribute(&#x27;download&#x27;, `รายงานโรงงาน_7(4)_${filteredFactories.length}_แห่ง.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast(`ส่งออกไฟล์ CSV จำนวน ${filteredFactories.length} รายการเรียบร้อยแล้ว`);
        }

        function showToast(message) {
            const toast = document.getElementById(&#x27;toastNotification&#x27;);
            document.getElementById(&#x27;toastMessage&#x27;).textContent = message;
            toast.classList.remove(&#x27;hidden&#x27;);
            toast.classList.add(&#x27;flex&#x27;);
            setTimeout(() =&gt; {
                toast.classList.add(&#x27;hidden&#x27;);
                toast.classList.remove(&#x27;flex&#x27;);
            }, 3200);
        }

        function escapeHTML(str) {
            return String(str ?? &#x27;&#x27;)
                .replace(/&amp;/g, &#x27;&amp;amp;&#x27;)
                .replace(/&lt;/g, &#x27;&amp;lt;&#x27;)
                .replace(/&gt;/g, &#x27;&amp;gt;&#x27;)
                .replace(/&quot;/g, &#x27;&amp;quot;&#x27;)
                .replace(/&#x27;/g, &#x27;&amp;#039;&#x27;);
        }
