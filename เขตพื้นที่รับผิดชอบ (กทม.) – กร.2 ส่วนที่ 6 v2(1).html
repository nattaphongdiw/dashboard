<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เขตพื้นที่รับผิดชอบ (กทม.) – กร.2 ส่วนที่ 6</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--ink:#102a43;--mu:#64748b;--bd:#e2e8f0;--soft:#f0f4f8;--nv:#243b53;--pb:#102a43;--pc:#fff;--pbd:#102a43;--ok:#10b981;--okb:#ecfdf5;--okt:#047857;--pa:#f43f5e;--pab:#fff1f2;--pat:#be123c;--un:#f59e0b;--unb:#fffbeb;--unt:#b45309;--yl:#eab308;--ylb:#fefce8;--ylt:#a16207;--rd:#ef4444;--rdb:#fef2f2;--rdt:#b91c1c;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1929;--card:#102a43;--tx:#e6edf5;--ink:#e6edf5;--mu:#9fb3c8;--bd:#243b53;--soft:#17324d;--nv:#9fb3c8;--pb:#243b53;--pbd:rgba(251,191,36,.55);--okb:rgba(16,185,129,.16);--okt:#34d399;--pab:rgba(244,63,94,.16);--pat:#fb7185;--unb:rgba(245,158,11,.16);--unt:#fbbf24;--ylb:rgba(234,179,8,.16);--ylt:#facc15;--rdb:rgba(239,68,68,.16);--rdt:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1929;--card:#102a43;--tx:#e6edf5;--ink:#e6edf5;--mu:#9fb3c8;--bd:#243b53;--soft:#17324d;--nv:#9fb3c8;--pb:#243b53;--pbd:rgba(251,191,36,.55);--okb:rgba(16,185,129,.16);--okt:#34d399;--pab:rgba(244,63,94,.16);--pat:#fb7185;--unb:rgba(245,158,11,.16);--unt:#fbbf24;--ylb:rgba(234,179,8,.16);--ylt:#facc15;--rdb:rgba(239,68,68,.16);--rdt:#f87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 Sarabun,"Noto Sans Thai",system-ui,sans-serif}
h1,h2,.kv{font-family:Prompt,Sarabun,system-ui,sans-serif}
svg{display:block}
header{background:linear-gradient(90deg,#0a1929,#102a43 55%,#0f172a);color:#fff;border-bottom:1px solid #243b53;box-shadow:0 4px 12px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px)}
.hd{max-width:1280px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.brand>div{min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:rgba(36,59,83,.9);border:1px solid rgba(72,101,129,.6);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.logo img{width:100%;height:100%;object-fit:contain}
h1{margin:0;font-size:22px;font-weight:700;line-height:1.3;display:inline}
.badge{display:inline-block;margin-left:8px;vertical-align:middle;font-size:12px;padding:1px 10px;border-radius:99px;background:rgba(245,158,11,.2);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
.sub{color:#cbd5e1;font-size:13px;margin-top:2px}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#upd{color:#9fb3c8;font-size:12px}
.hb{display:inline-flex;gap:8px;align-items:center;background:#243b53;color:#e2e8f0;border:1px solid #486581;border-radius:12px;padding:9px 16px;font-weight:500}
.hb:hover{background:#334e68;color:#fff;border-color:#486581}
.wrap{max-width:1280px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.wrap>*,.grid>*,.card{min-width:0}
h2{margin:0 0 12px;font-size:16px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 svg{color:var(--nv)}
.chd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chd h2{margin:0}
.tbtn{padding:4px 10px;font-size:12px;border-radius:99px;background:var(--soft);border:1px solid var(--bd);color:var(--ink);font-weight:500}
.tbtn:hover{border-color:var(--nv)}
.tbtn[aria-pressed="true"]{background:var(--pb);color:var(--pc);border-color:var(--pbd)}
.mu{color:var(--mu)}.sm{font-size:12px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--nv)}
#msg{background:var(--unb);border:1px solid var(--un);border-radius:12px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
#msg[hidden]{display:none}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{display:inline-flex;align-items:center;gap:6px;font-weight:500;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.tabs button[aria-pressed="true"]{background:var(--pb);color:var(--pc);border-color:var(--pbd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.06);padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kc{position:relative;overflow:hidden;padding:18px 20px 20px}
.kc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.kt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.kl{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--lt)}
.kv{font-size:30px;font-weight:700;line-height:1.2;margin-top:6px;color:var(--tt)}
.kv small{font-family:Sarabun,sans-serif;font-size:14px;font-weight:500;color:var(--mu)}
.ks{margin:6px 0 0;font-size:12px;color:var(--mu)}
.pc{display:inline-block;padding:1px 8px;border-radius:6px;font-weight:600;background:var(--tb);color:var(--tt)}
.ki{width:44px;height:44px;border-radius:12px;background:var(--tb);color:var(--tt);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.t-nv{--c:var(--nv);--tb:var(--soft);--tt:var(--ink);--lt:var(--mu)}
.t-ok{--c:var(--ok);--tb:var(--okb);--tt:var(--okt);--lt:var(--okt)}
.t-pa{--c:var(--pa);--tb:var(--pab);--tt:var(--pat);--lt:var(--pat)}
.t-un{--c:var(--un);--tb:var(--unb);--tt:var(--unt);--lt:var(--unt)}
.t-yl{--c:var(--yl);--tb:var(--ylb);--tt:var(--ylt);--lt:var(--ylt)}
.t-rd{--c:var(--rd);--tb:var(--rdb);--tt:var(--rdt);--lt:var(--rdt)}
.t-gy{--tb:var(--soft);--tt:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.row{display:grid;grid-template-columns:104px 1fr 52px;gap:8px;align-items:center;margin:6px 0}
.row.pick{cursor:pointer}
.lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num{text-align:right;font-variant-numeric:tabular-nums}
.track{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bar{height:100%;display:flex;border-radius:7px;overflow:hidden;background:var(--nv)}.bar i{display:block;min-width:0}
.ex{padding-left:112px;margin:-4px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}.lg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

/* สไตล์สำหรับรายการประเภทโรงงานและประเภทย่อย */
#types.all-mode{max-height:540px;overflow-y:auto;padding-right:6px}
.t-item{border-radius:10px;padding:4px 8px;margin:2px -8px;transition:background .15s}
.t-item:hover{background:var(--soft)}
.t-item .row{margin:2px 0;grid-template-columns:116px 1fr 52px}
.t-item .ex{padding-left:124px;margin:0 0 2px}
.t-item .lb{display:flex;align-items:center;gap:4px;font-weight:500}
.chev{display:inline-block;font-size:10px;color:var(--mu);transition:transform .2s;width:12px;text-align:center}
.t-item.open .chev{transform:rotate(90deg);color:var(--ink)}
.sub-box{margin:6px 0 4px 16px;padding:8px 10px;background:var(--soft);border-left:3px solid var(--nv);border-radius:0 10px 10px 0;display:grid;gap:6px}
.sub-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:5px 8px;border-radius:8px;background:var(--card);border:1px solid var(--bd);cursor:pointer;transition:border-color .15s,background .15s}
.sub-row:hover{border-color:var(--nv)}
.sub-row.active{border-color:var(--pbd);background:var(--pb);color:var(--pc)}
.sub-row.active .mu{color:rgba(255,255,255,.78)}
.sub-info{min-width:0;flex:1}
.sub-code{font-weight:600;font-size:13px}
.sub-act{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-cnt{font-weight:600;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap;flex-shrink:0}
.sub-row.active .sub-cnt{background:rgba(255,255,255,.18);color:#fff}
.f-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--pb);color:var(--pc);font-size:12px;font-weight:500}
.f-pill button{padding:0 4px;border:0;background:transparent;color:inherit;font-weight:700;line-height:1}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.sw{position:relative;flex:1;min-width:200px}.sw svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mu);pointer-events:none}
.sw input{width:100%;padding-left:36px}
#ft{max-width:280px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--mu);font-weight:600;background:var(--soft);letter-spacing:.03em}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--tb);color:var(--tt)}
#more{margin:14px auto 0;display:block}#more[hidden]{display:none}

/* ===== รองรับจอมือถือ (ไม่ให้ล้นจอ) ===== */
html,body{max-width:100%}
img{max-width:100%}
.t-item,.sub-row{min-width:0}
.sub-box{grid-template-columns:minmax(0,1fr)}
@media (max-width:640px){
  body{font-size:14px;-webkit-text-size-adjust:100%}
  .hd{padding-top:14px;padding-bottom:14px;gap:10px}
  .brand{gap:10px;width:100%}
  .logo{width:40px;height:40px;border-radius:10px}
  h1{font-size:18px;line-height:1.35}
  .badge{display:table;margin:4px 0 0;font-size:11px}
  .sub{font-size:12px}
  .act{width:100%;justify-content:space-between;gap:8px}
  .hb{padding:7px 12px;border-radius:10px}
  .wrap{padding-top:14px;padding-bottom:14px;gap:12px}
  .card{padding:14px;border-radius:14px}
  h2{font-size:15px}

  /* ปุ่มเลือกเขต */
  .tabs{gap:6px}
  .tabs button{flex:1 1 auto;justify-content:center;padding:7px 10px}

  /* การ์ดตัวเลข: 2 คอลัมน์ */
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpis>.kc:last-child:nth-child(odd){grid-column:1/-1}
  .kc{padding:12px 12px 16px}
  .kt{gap:6px}
  .kl{font-size:11px;letter-spacing:0}
  .kv{font-size:22px}
  .kv small{font-size:12px}
  .ks{font-size:11px}
  .ki{width:34px;height:34px;font-size:18px;border-radius:10px}

  /* กราฟแท่ง / ประเภทโรงงาน */
  .grid{grid-template-columns:minmax(0,1fr)}
  .row{grid-template-columns:84px minmax(0,1fr) 44px}
  .t-item .row{grid-template-columns:104px minmax(0,1fr) 44px}
  .ex,.t-item .ex{padding-left:0}
  .sub-box{margin-left:6px;padding:6px 8px}
  .sub-act{white-space:normal}
  #types.all-mode{max-height:420px}

  /* เครื่องมือค้นหา/กรอง: เรียงลงแนวตั้ง กว้างเต็มจอ */
  .tools{flex-direction:column;align-items:stretch;gap:8px}
  .sw{flex:none;min-width:0;width:100%}
  #ft,#fs{width:100%;max-width:none;min-width:0}
  input,select{font-size:16px}

  /* ตาราง -> การ์ดรายโรงงาน */
  .tw{border:0;border-radius:0;overflow:visible}
  table{min-width:0;display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  tbody{display:grid;gap:10px}
  tr{display:block;border:1px solid var(--bd);border-radius:12px;padding:8px 12px;background:var(--card)}
  td{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;padding:4px 0;border:0;overflow-wrap:anywhere;min-width:0}
  td::before{content:attr(data-l);color:var(--mu);font-size:12px;font-weight:600}
  td.nm{font-weight:600;color:var(--ink)}
  td .tag{justify-self:start;align-self:center}
  #more{width:100%}
}
@media (max-width:360px){
  .kv{font-size:20px}
  .row{grid-template-columns:76px minmax(0,1fr) 40px}
  .t-item .row{grid-template-columns:92px minmax(0,1fr) 40px}
  td{grid-template-columns:76px minmax(0,1fr)}
}
</style>
</head>

const ST = ["ดำเนินการ", "หยุดชั่วคราว", "ยังไม่แจ้งประกอบ"];
const TONE = { "ดำเนินการ": "ok", "หยุดชั่วคราว": "yl", "ยังไม่แจ้งประกอบ": "rd" };

const rows = {}, err = {}, ts = {}, F = { d: "", s: "", q: "", ty: "", showAllTy: false, n: 100 };
const openTypes = new Set();
let isFetching = false;

const sv = p => `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  bld: sv('<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M9 21v-4h6v4"/>'),
  ok: sv('<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/>'),
  pause: sv('<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>'),
  clock: sv('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  ind: sv('<path d="M3 21V11l6 4v-4l6 4V4h6v17z"/><path d="M18 9h.01M18 13h.01"/>'),
  search: sv('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
  rot: sv('<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>'),
  layers: sv('<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>'),
  pin: sv('<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
  chart: sv('<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'),
  list: sv('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>')
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const N = n => n.toLocaleString("th-TH");

// ฟังก์ชันดึงข้อมูลแบบ JSONP (แก้ปัญหาเปิดไฟล์ในเครื่องแล้วติดบล็อก CORS)
function fetchSheetTab(sheetName, label) {
  return new Promise((resolve) => {
    const cbName = "gvizCb_" + Math.random().toString(36).substring(2, 9);
    const script = document.createElement("script");
    
    const timer = setTimeout(() => {
      cleanup();
      err[sheetName] = "หมดเวลาการเชื่อมต่อ (Timeout)";
      resolve();
    }, 10000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function (data) {
      cleanup();
      try {
        if (!data || data.status === "error") {
          throw new Error(data?.errors?.[0]?.detailed_message || "Sheet Error");
        }

        const table = data.table;
        let headers = table.cols.map((c) => (c.label || "").trim());
        let dataRows = table.rows;

        if (headers.every((h) => !h) && dataRows.length > 0) {
          headers = dataRows[0].c.map((cell) => (cell && cell.v != null ? String(cell.v).trim() : ""));
          dataRows = dataRows.slice(1);
        }

        const ix = COLS.map((c, i) => {
          const k = headers.indexOf(c);
          return k < 0 ? i : k;
        });

        const parsed = dataRows
          .filter((r) => r && r.c && r.c.some((cell) => cell && cell.v != null && String(cell.v).trim() !== ""))
          .map((r) => {
            const g = (i) => {
              const cell = r.c[ix[i]];
              const val = cell ? (cell.f != null ? cell.f : cell.v) : "";
              return String(val == null ? "" : val).replace(/\s+/g, " ").trim();
            };
            return { d: label, reg: g(1), name: g(3), st: g(4), cl: g(5), ty: g(6), act: g(7) };
          });

        rows[sheetName] = parsed;
        err[sheetName] = null;
        ts[sheetName] = Date.now();
      } catch (e) {
        console.error(`Parse error (${sheetName}):`, e);
        err[sheetName] = "รูปแบบข้อมูลไม่ถูกต้องหรือชื่อแท็บไม่ตรง";
      }
      resolve();
    };

    script.onerror = function () {
      cleanup();
      err[sheetName] = "ไม่สามารถเข้าถึงไฟล์ได้ (อาจติดสิทธิ์บัญชีองค์กรหรือไฟล์ไม่ใช่ Google Sheets แท้)";
      resolve();
    };

    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}&sheet=${encodeURIComponent(sheetName)}`;
    document.head.appendChild(script);
  });
}

async function loadAll() {
  if (isFetching) return;
  isFetching = true;
  $("upd").textContent = "กำลังโหลดข้อมูลจาก Google Sheets…";
  await Promise.all(TABS.map(([t, l]) => fetchSheetTab(t, l)));
  isFetching = false;
  render();
}

function render() {
  const every = TABS.flatMap(([t]) => rows[t] || []);
  const all = F.d ? every.filter(r => r.d === F.d) : every;
  const tot = all.length,
    ok = all.filter(r => r.st === "ดำเนินการ").length,
    pa = all.filter(r => r.st === "หยุดชั่วคราว").length,
    ot = all.filter(r => r.st === "ยังไม่แจ้งประกอบ").length;
  const c3 = all.filter(r => r.cl === "3").length,
    c2 = all.filter(r => r.cl === "2").length,
    has = tot > 0;

  const k = (l, v, u, s, ic, tn) =>
    `<div class="card kc t-${tn}"><div class="kt"><div><p class="kl">${l}</p><div class="kv">${v}<small>${u}</small></div><p class="ks">${s}</p></div><div class="ki">${I[ic]}</div></div></div>`;
  const pc = n => (has ? `คิดเป็น <span class="pc">${((n / tot) * 100).toFixed(1)}%</span> ของที่แสดง` : "&nbsp;");

  $("kpi").innerHTML =
    k("โรงงานทั้งหมด", has ? N(tot) : "–", " แห่ง", F.d ? "เขต" + F.d : "รวม 3 เขต", "bld", "nv") +
    k("ดำเนินการ", has ? N(ok) : "–", " แห่ง", pc(ok), "ok", "ok") +
    k("หยุดชั่วคราว", has ? N(pa) : "–", " แห่ง", pc(pa), "pause", "yl") +
    k("ยังไม่แจ้งประกอบ", has ? N(ot) : "–", " แห่ง", pc(ot), "clock", "rd") +
    k("จำพวก 3 / จำพวก 2", has ? N(c3) + " / " + N(c2) : "–", "", "จำแนกตามจำพวกโรงงาน", "ind", "nv");

  const per = TABS.map(([t, l]) => {
    const a = rows[t] || [];
    return {
      l,
      n: a.length,
      ok: a.filter(r => r.st === "ดำเนินการ").length,
      p: a.filter(r => r.st === "หยุดชั่วคราว").length,
      u: a.filter(r => r.st === "ยังไม่แจ้งประกอบ").length,
      on: !!rows[t]
    };
  });
  const mx = Math.max(1, ...per.map(x => x.n));

  $("dist").innerHTML = per
    .map(
      x =>
        `<div class="row pick" data-d="${x.l}" title="คลิกเพื่อดูเฉพาะเขตนี้" style="opacity:${!F.d || x.l === F.d ? 1 : 0.45}"><div class="lb">${x.l}</div><div class="track"><div class="bar" style="width:${(x.n / mx) * 100}%"><i style="flex:${x.ok};background:var(--ok)"></i><i style="flex:${x.p};background:#eab308"></i><i style="flex:${x.u};background:#ef4444"></i><i style="flex:${x.n - x.ok - x.p - x.u};background:var(--bd)"></i></div></div><div class="num">${x.on ? N(x.n) : "–"}</div></div>`
    )
    .join("");

  [...$("tabs").children].forEach(b => {
    const d = b.dataset.d,
      x = per.find(p => p.l === d);
    b.setAttribute("aria-pressed", F.d === d);
    b.querySelector("[data-c]").textContent = d
      ? x && x.on
        ? "(" + N(x.n) + ")"
        : ""
      : per.some(p => p.on)
      ? "(" + N(per.reduce((s, p) => s + p.n, 0)) + ")"
      : "";
  });

  // จัดกลุ่มประเภทหลัก + ประเภทโรงงานย่อย
  const g = {};
  all.forEach(r => {
    const rawTy = (r.ty || "").trim() || "ไม่ระบุ";
    const mainCode = rawTy.replace(/\(.*$/, "").trim() || "ไม่ระบุ";
    if (!g[mainCode]) g[mainCode] = { c: mainCode, n: 0, ex: r.act, subs: {} };
    g[mainCode].n++;
    if (!g[mainCode].ex && r.act) g[mainCode].ex = r.act;

    if (!g[mainCode].subs[rawTy]) g[mainCode].subs[rawTy] = { code: rawTy, n: 0, ex: r.act };
    g[mainCode].subs[rawTy].n++;
    if (!g[mainCode].subs[rawTy].ex && r.act) g[mainCode].subs[rawTy].ex = r.act;
  });

  const sortedAllTypes = Object.values(g).sort((a, b) => b.n - a.n || a.c.localeCompare(b.c, "th", { numeric: true }));
  const totalTypeCount = sortedAllTypes.length;
  const shownTypes = F.showAllTy ? sortedAllTypes : sortedAllTypes.slice(0, 10);
  const m2 = shownTypes.length ? shownTypes[0].n : 1;

  // อัปเดตหัวข้อและปุ่มสลับ 10 อันดับ / ทั้งหมด
  $("ty-title").textContent = F.showAllTy
    ? `ประเภทโรงงานทั้งหมด (${N(totalTypeCount)} ประเภท)`
    : "ประเภทโรงงานสูงสุด 10 อันดับ";
  const tyBtn = $("ty-all");
  tyBtn.hidden = totalTypeCount <= 10;
  tyBtn.setAttribute("aria-pressed", F.showAllTy);
  tyBtn.textContent = F.showAllTy ? "แสดง 10 อันดับแรก" : `ดูทั้งหมด (${N(totalTypeCount)})`;
  $("types").classList.toggle("all-mode", F.showAllTy);

  $("types").innerHTML = shownTypes.length
    ? shownTypes
        .map(x => {
          const isOpen = openTypes.has(x.c);
          const subList = Object.values(x.subs).sort((a, b) => b.n - a.n || a.code.localeCompare(b.code, "th", { numeric: true }));
          const subHtml = isOpen
            ? `<div class="sub-box">${subList
                .map(
                  s =>
                    `<div class="sub-row${F.ty === s.code ? " active" : ""}" data-sub="${esc(s.code)}" title="คลิกเพื่อกรองรายชื่อโรงงานประเภท ${esc(s.code)} ในตารางด้านล่าง">
                      <div class="sub-info">
                        <div class="sub-code">ประเภท ${esc(s.code)}</div>
                        <div class="mu sub-act">${esc(s.ex || "-")}</div>
                      </div>
                      <span class="sub-cnt">${N(s.n)} แห่ง</span>
                    </div>`
                )
                .join("")}</div>`
            : "";

          return `<div class="t-item${isOpen ? " open" : ""}">
            <div class="row pick" data-main="${esc(x.c)}" title="คลิกเพื่อดูประเภทย่อย (${subList.length} ประเภทย่อย)">
              <div class="lb"><span class="chev">▶</span>ประเภท ${esc(x.c)}</div>
              <div class="track"><div class="bar" style="width:${(x.n / m2) * 100}%"></div></div>
              <div class="num">${N(x.n)}</div>
            </div>
            <div class="mu sm ex">${esc((x.ex || "").slice(0, 60))}</div>
            ${subHtml}
          </div>`;
        })
        .join("")
    : '<div class="mu">ยังไม่มีข้อมูล</div>';

  // สร้างตัวเลือกใน Dropdown ประเภทโรงงานทั้งหมด (เรียงตามเลขประเภท)
  const mainSortedByCode = Object.values(g).sort((a, b) => a.c.localeCompare(b.c, "th", { numeric: true }));
  let ftHtml = `<option value="">ทุกประเภทโรงงาน (${N(totalTypeCount)} ประเภท)</option>`;
  mainSortedByCode.forEach(m => {
    const subs = Object.values(m.subs).sort((a, b) => a.code.localeCompare(b.code, "th", { numeric: true }));
    ftHtml += `<optgroup label="ประเภท ${esc(m.c)} (${N(m.n)} แห่ง)">`;
    if (subs.length > 1) {
      ftHtml += `<option value="MAIN:${esc(m.c)}">ทั้งหมดในประเภท ${esc(m.c)} (${N(m.n)} แห่ง)</option>`;
    }
    subs.forEach(s => {
      const hint = s.ex ? " — " + s.ex.slice(0, 32) + (s.ex.length > 32 ? "…" : "") : "";
      ftHtml += `<option value="${esc(s.code)}">ประเภท ${esc(s.code)} (${N(s.n)})${esc(hint)}</option>`;
    });
    ftHtml += `</optgroup>`;
  });
  $("ft").innerHTML = ftHtml;
  $("ft").value = F.ty;
  if ($("ft").value !== F.ty) {
    F.ty = "";
    $("ft").value = "";
  }

  // แสดงป้ายตัวกรองประเภทที่หัวตาราง (ถ้ามีการเลือก)
  const tyLabel = F.ty.startsWith("MAIN:") ? `ประเภท ${F.ty.slice(5)} (ทั้งหมด)` : `ประเภท ${F.ty}`;
  $("tf-wrap").innerHTML = F.ty
    ? `<span class="f-pill">${esc(tyLabel)} <button type="button" id="clr-ty" title="ล้างตัวกรองประเภท">×</button></span>`
    : "";

  const q = F.q.toLowerCase();
  const list = all.filter(r => {
    const rawTy = (r.ty || "").trim() || "ไม่ระบุ";
    const mainCode = rawTy.replace(/\(.*$/, "").trim() || "ไม่ระบุ";
    const matchTy = !F.ty || (F.ty.startsWith("MAIN:") ? mainCode === F.ty.slice(5) : rawTy === F.ty);
    return (
      (!F.s || r.st === F.s) &&
      matchTy &&
      (!q || (r.name + " " + r.act + " " + r.reg + " " + r.ty).toLowerCase().includes(q))
    );
  });
  $("cnt").textContent = (F.d ? "เขต" + F.d + " · " : "") + "พบ " + N(list.length) + " รายการ";
  $("tb").innerHTML = list
    .slice(0, F.n)
    .map(
      r =>
        `<tr><td data-l="เขต">${esc(r.d)}</td><td data-l="ชื่อโรงงาน" class="nm">${esc(!r.name || r.name === "-" ? "(ไม่ระบุชื่อ)" : r.name)}</td><td data-l="สถานะ"><span class="tag t-${TONE[r.st] || "gy"}">${esc(r.st || "-")}</span></td><td data-l="จำพวก">${esc(r.cl)}</td><td data-l="ประเภท">${esc(r.ty)}</td><td data-l="ประกอบกิจการ">${esc(r.act)}</td></tr>`
    )
    .join("");
  $("more").hidden = list.length <= F.n;

  const t = Math.max(0, ...TABS.map(([x]) => ts[x] || 0));
  $("upd").textContent = t ? "อัปเดตล่าสุด " + new Date(t).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" }) : "";

  const errList = TABS.filter(([x]) => err[x]).map(([, l]) => l);
  const bad = every.filter(r => !ST.includes(r.st)).length;
  let msgHtml = "";
  if (errList.length) {
    msgHtml += `<div>ไม่สามารถดึงข้อมูลเขต: ${esc(errList.join(", "))} — ตรวจสอบว่าตั้งค่าแชร์ไฟล์ Google Sheets เป็น "ทุกคนที่มีลิงก์ (ผู้มีสิทธิ์อ่าน)" แล้วหรือไม่</div>`;
  }
  if (bad) {
    msgHtml += `<div>พบ ${N(bad)} แถวที่สถานะไม่ใช่ 3 ค่าที่กำหนด (ดำเนินการ / หยุดชั่วคราว / ยังไม่แจ้งประกอบ) จึงไม่ถูกนับในการ์ดสถานะ — ตรวจสอบในชีต</div>`;
  }
  $("msg").innerHTML = msgHtml;
  $("msg").hidden = !msgHtml;
}

document.querySelectorAll("[data-i]").forEach(e => {
  e.innerHTML = I[e.dataset.i];
});
$("fs").innerHTML += ST.map(s => `<option>${s}</option>`).join("");
const setD = d => {
  F.d = d;
  F.n = 100;
  render();
};
$("tabs").innerHTML = [["", "ทุกเขต"], ...TABS.map(([, l]) => [l, l])]
  .map(([v, l]) => `<button type="button" data-d="${v}">${v ? I.pin : I.layers}${l} <span class="sm" data-c></span></button>`)
  .join("");
$("tabs").onclick = e => {
  const b = e.target.closest("button");
  if (b) setD(b.dataset.d);
};
$("dist").onclick = e => {
  const r = e.target.closest("[data-d]");
  if (r) setD(r.dataset.d === F.d ? "" : r.dataset.d);
};
$("ty-all").onclick = () => {
  F.showAllTy = !F.showAllTy;
  render();
};
$("types").onclick = e => {
  const sub = e.target.closest("[data-sub]");
  if (sub) {
    const code = sub.dataset.sub;
    F.ty = F.ty === code ? "" : code;
    F.n = 100;
    render();
    return;
  }
  const main = e.target.closest("[data-main]");
  if (main) {
    const code = main.dataset.main;
    if (openTypes.has(code)) openTypes.delete(code);
    else openTypes.add(code);
    render();
  }
};
$("tf-wrap").onclick = e => {
  if (e.target.closest("#clr-ty")) {
    F.ty = "";
    F.n = 100;
    render();
  }
};
$("ft").onchange = e => {
  F.ty = e.target.value;
  F.n = 100;
  render();
};
$("fs").onchange = e => {
  F.s = e.target.value;
  F.n = 100;
  render();
};
$("q").oninput = e => {
  F.q = e.target.value.trim();
  F.n = 100;
  render();
};
$("more").onclick = () => {
  F.n += 200;
  render();
};
$("rf").onclick = () => loadAll();

// เริ่มต้นโหลดข้อมูลและตั้งเวลาดึงซ้ำทุก 1 นาที
render();
loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
